<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald-Obsidian Luxury Background (#0B241C -> #163F31) -->
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B241C"/>
      <stop offset="50%" stop-color="#103126"/>
      <stop offset="100%" stop-color="#163F31"/>
    </linearGradient>

    <!-- Warm Top-Right Champagne-Gold Ambient Glow -->
    <radialGradient id="ambientGlow" cx="80%" cy="18%" r="64%">
      <stop offset="0%" stop-color="#EAD098" stop-opacity="0.30"/>
      <stop offset="48%" stop-color="#D99B26" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0B241C" stop-opacity="0"/>
    </radialGradient>

    <!-- Brushed Champagne-Gold -->
    <linearGradient id="champagneGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E4"/>
      <stop offset="50%" stop-color="#E8C67D"/>
      <stop offset="100%" stop-color="#B9832E"/>
    </linearGradient>

    <!-- Warm Ivory Menu Card -->
    <linearGradient id="ivoryCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="55%" stop-color="#F5EAD5"/>
      <stop offset="100%" stop-color="#E6D5B6"/>
    </linearGradient>

    <!-- Warm Terracotta Bowl -->
    <linearGradient id="terracottaBowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA9B59"/>
      <stop offset="55%" stop-color="#CD6A33"/>
      <stop offset="100%" stop-color="#8D3A17"/>
    </linearGradient>

    <!-- Steam Ribbon Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E8C67D" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF8E7" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Luminous Emerald Health Leaf -->
    <linearGradient id="emeraldLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <filter id="softShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Luxury Squircle Backdrop -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1E4D3C" stroke-width="3" filter="url(#softShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#ambientGlow)"/>

  <!-- 1. Back-Left-Center Rounded Ivory Menu Card (3 Gold Lines + 3 Emerald Check Dots) -->
  <rect x="84.5" y="138.2" width="189.4" height="215" rx="30.7"
        fill="url(#ivoryCardGrad)" stroke="#DEC592" stroke-opacity="0.72" stroke-width="7" filter="url(#softShadow)"/>

  <circle cx="120.3" cy="186.9" r="10.8" fill="#10B981"/>
  <rect x="143.4" y="181.2" width="99.8" height="11.3" rx="5.6" fill="url(#champagneGoldGrad)"/>

  <circle cx="120.3" cy="222.7" r="10.8" fill="#10B981"/>
  <rect x="143.4" y="217.1" width="84.5" height="11.3" rx="5.6" fill="url(#champagneGoldGrad)"/>

  <circle cx="120.3" cy="258.6" r="10.8" fill="#059669"/>
  <rect x="143.4" y="252.9" width="69.1" height="11.3" rx="5.6" fill="url(#champagneGoldGrad)"/>

  <!-- 2. Front-Center Warm Terracotta & Gold-Banded Serving Bowl -->
  <rect x="225.3" y="401.9" width="92.2" height="25.6" rx="11.3" fill="#8C3A16"/>
  <path d="M 128 291.8 C 128 373.8 189.4 412.2 271.4 412.2 C 353.3 412.2 414.7 373.8 414.7 291.8 Z"
        fill="url(#terracottaBowlGrad)" filter="url(#softShadow)"/>
  <path d="M 139.3 331.8 Q 271.4 376.3 403.5 331.8"
        fill="none" stroke="url(#champagneGoldGrad)" stroke-width="13.3" stroke-linecap="round"/>
  <ellipse cx="271.4" cy="291.8" rx="143.4" ry="22.5"
           fill="#24120B" stroke="url(#champagneGoldGrad)" stroke-width="12.3"/>

  <!-- 3. Twin Graceful Heart/Pulse Steam Ribbons -->
  <path d="M 233 284.2 C 186.9 248.3 186.9 181.8 238.1 151 Q 253.4 140.8 266.2 149.5"
        fill="none" stroke="url(#steamGrad)" stroke-width="12.8" stroke-linecap="round"/>
  <path d="M 314.9 284.2 C 376.3 248.3 396.8 189.4 361 153.6 Q 347.1 142.3 335.4 151"
        fill="none" stroke="url(#steamGrad)" stroke-width="12.8" stroke-linecap="round"/>

  <!-- 4. Central-Top Emerald Health Leaf + White Pulse Line + Sparkles -->
  <path d="M 281.6 227.8 C 240.6 176.6 258.6 99.8 355.8 81.9 C 376.3 161.3 340.5 217.6 281.6 227.8 Z"
        fill="url(#emeraldLeafGrad)" stroke="#A7F3D0" stroke-opacity="0.72" stroke-width="7" filter="url(#softShadow)"/>
  <path d="M 263.7 163.8 L 284.2 163.8 L 297 129 L 312.3 186.9 L 325.1 145.9 L 335.4 159.7 L 353.3 159.7"
        fill="none" stroke="#FFFFFF" stroke-width="11.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Four-Point Sparkles & Gleam Dot -->
  <path d="M 391.7 76.3 Q 394.7 96.8 415.2 99.8 Q 394.7 102.8 391.7 123.3 Q 388.7 102.8 368.2 99.8 Q 388.7 96.8 391.7 76.3 Z"
        fill="#FFFDF4"/>
  <path d="M 263.7 81.9 Q 265.3 93.1 276.5 94.7 Q 265.3 96.3 263.7 107.5 Q 262.1 96.3 250.9 94.7 Q 262.1 93.1 263.7 81.9 Z"
        fill="#F6DBA0"/>
  <circle cx="412.2" cy="135.7" r="7.7" fill="#F6DBA0"/>
</svg>
