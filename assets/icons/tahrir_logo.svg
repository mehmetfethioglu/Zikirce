<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1E"/>
      <stop offset="100%" stop-color="#0E0E10"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EEDB"/>
      <stop offset="45%" stop-color="#D99B26"/>
      <stop offset="100%" stop-color="#C85A32"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5D6BD"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#27272A" stroke-width="3" filter="url(#shadow)"/>

  <!-- Fluid Reflow Lines (Left Flow) -->
  <path d="M 170 200 C 130 220, 110 270, 130 330 C 145 375, 190 405, 256 415" 
        fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
  <path d="M 180 230 C 145 250, 130 290, 145 340 C 160 375, 195 395, 240 405" 
        fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  <path d="M 190 260 C 160 280, 150 310, 160 350 C 175 375, 205 390, 230 395" 
        fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.4"/>

  <!-- Main Lowercase 't' Body & Reflow Curve -->
  <!-- Stem -->
  <path d="M 244 140 C 244 140, 252 144, 256 160 L 256 340 C 256 385, 290 405, 335 390 C 350 385, 360 375, 360 375 C 360 375, 345 365, 330 365 C 300 365, 288 350, 288 320 L 288 190 L 335 190 C 345 190, 350 185, 345 178 C 340 170, 330 168, 315 168 L 288 168 L 288 125 C 288 115, 278 110, 270 115 C 255 125, 244 140, 244 140 Z" 
        fill="url(#goldGrad)"/>

  <!-- Crossbar Wave & Page Wings (Right Flow) -->
  <path d="M 160 200 C 210 180, 280 180, 340 150 C 370 135, 395 160, 375 190 C 360 210, 335 220, 310 220" 
        fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Book Page Wing Reflow Blades -->
  <path d="M 290 220 C 330 225, 385 240, 405 285 C 410 295, 395 305, 380 300 C 340 285, 305 265, 285 250" 
        fill="url(#pageGrad)" opacity="0.9"/>
  <path d="M 288 250 C 325 255, 375 275, 390 320 C 395 330, 380 340, 365 335 C 330 320, 300 295, 285 280" 
        fill="url(#pageGrad)" opacity="0.8"/>
  <path d="M 285 280 C 315 285, 360 305, 375 350 C 380 360, 365 368, 350 362 C 320 348, 295 325, 285 310" 
        fill="url(#goldGrad)" opacity="0.75"/>
</svg>
