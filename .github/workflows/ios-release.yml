name: Zamera iOS Cloud Build, TestFlight & App Store Connect

on:
  push:
    branches: [ zamera-release ]
  workflow_dispatch:
    inputs:
      enable_video_module:
        description: "Enable Pro Video module (ZAMERA_VIDEO)"
        required: false
        default: "true"

jobs:
  build-ios:
    name: Build iOS (macOS Apple Silicon + Rust Staticlib + TestFlight)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      ZAMERA_VIDEO: ${{ github.event.inputs.enable_video_module || 'true' }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Install Rust iOS target (aarch64-apple-ios)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 3. Build & Test zamera_core staticlib for iOS
        working-directory: rust/zamera_core
        run: |
          cargo test --release
          cargo build --release --target aarch64-apple-ios

      - name: 4. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 5. Prepare Flutter iOS & CocoaPods
        working-directory: app
        run: |
          xcodebuild -version
          flutter config --no-enable-swift-package-manager
          flutter doctor -v
          flutter pub get
          flutter build ios --config-only --no-codesign --dart-define=ZAMERA_VIDEO=${{ env.ZAMERA_VIDEO }}
          cd ios
          pod install --repo-update

      - name: 6. Deploy to TestFlight via Fastlane
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        working-directory: app/ios
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          bundle install
          bundle exec fastlane beta

      - name: Print gym build log on failure
        if: failure()
        run: |
          find ~/Library/Logs/gym -name "*.log" -exec cat {} + || true

      - name: 7. Upload Signed IPA Artifact
        if: always() && hashFiles('app/build/ios/ipa/Zamera.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: zamera-ios-signed-ipa
          path: app/build/ios/ipa/Zamera.ipa
          retention-days: 14

  sync-appstore-connect:
    name: Sync v0.1.4 (Build 5) Release Notes & Attach Build in App Store Connect
    needs: build-ios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
    steps:
      - name: Install PyJWT, Cryptography & Requests
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        run: pip install pyjwt cryptography requests

      - name: Update App Store Version 0.1.4, Set TR/EN Notes & Attach Build 5
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        run: |
          python3 - << 'EOF'
          import os, sys, time, jwt, requests

          key_id = os.environ["APP_STORE_KEY_ID"].strip()
          issuer_id = os.environ["APP_STORE_ISSUER_ID"].strip()
          private_key = os.environ["APP_STORE_PRIVATE_KEY"].strip()

          def make_headers():
              now = int(time.time())
              payload = {
                  "iss": issuer_id,
                  "iat": now - 30,
                  "exp": now + 1100,
                  "aud": "appstoreconnect-v1",
              }
              token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
              return {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          BASE = "https://api.appstoreconnect.apple.com/v1"
          VERSION_STR = "0.1.4"
          BUILD_NUM = "5"

          r = requests.get(f"{BASE}/apps?filter[bundleId]=com.akarworks.zamera", headers=make_headers())
          r.raise_for_status()
          apps = r.json().get("data", [])
          if not apps:
              print("ℹ️ App com.akarworks.zamera not yet found via apps endpoint.")
              sys.exit(0)
          app_id = apps[0]["id"]
          print(f"✅ Found App ID: {app_id}")

          r = requests.get(f"{BASE}/apps/{app_id}/appStoreVersions?filter[platform]=IOS", headers=make_headers())
          r.raise_for_status()
          versions = r.json().get("data", [])
          target_version_id = None
          editable_version = None

          for v in versions:
              v_str = v["attributes"]["versionString"]
              v_state = v["attributes"]["appStoreState"]
              print(f"  Existing version: {v_str} (state: {v_state}, id: {v['id']})")
              if v_str == VERSION_STR:
                  target_version_id = v["id"]
                  break
              if v_state in ("PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED", "WAITING_FOR_REVIEW", "INVALID_BINARY"):
                  editable_version = v

          if not target_version_id and editable_version:
              target_version_id = editable_version["id"]
              up = requests.patch(
                  f"{BASE}/appStoreVersions/{target_version_id}",
                  headers=make_headers(),
                  json={"data": {"type": "appStoreVersions", "id": target_version_id, "attributes": {"versionString": VERSION_STR}}},
              )
              print("🔄 Update versionString status:", up.status_code)

          if not target_version_id:
              cr = requests.post(
                  f"{BASE}/appStoreVersions",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersions",
                          "attributes": {"platform": "IOS", "versionString": VERSION_STR, "releaseType": "AFTER_APPROVAL"},
                          "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
                      }
                  },
              )
              if cr.status_code in (200, 201):
                  target_version_id = cr.json()["data"]["id"]
                  print("➕ Created App Store Version:", VERSION_STR)
              else:
                  print("ℹ️ Could not create new App Store Version:", cr.status_code, cr.text[:300])

          whats_new_tr = (
              "Zamera v0.1.4 Yenilikleri:\n"
              "• Sanat Modu 1:1 Radyometrik Pozlama Düzeltmesi: 1:1 TON ve KAĞIT L*94 çekimlerinde ΔE00 renk doğruluğu, CIE (x, y) kromatisitesi ve koyu (chiaroscuro) tonlar %100 korunarak karanlık kalan RAW pozlama sahne-doğrusal radyometrik referansla gerçek sahne parlaklığına kavuşturuldu.\n"
              "• Vernik & Cam Parlama Koruması: Noktasal yansımaların pozlamayı kilitlemesi p96 difüz pigment tavanıyla önlendi ve L* ≈ 96 sabit-tonlu parlak alan geçişi iyileştirildi.\n"
              "• iOS Vizör Kararlılığı: Oturum başlatma ve lens geçişleri sırasındaki canlı vizör görüntü akışı kararlılığı iyileştirildi.\n"
              "• Stüdyo Portre & Çekim Denetçisi: Sahne Işığı arka plan maskesi, şeffaf PNG panoya kopyalama akışı ve dokunarak piksel CIE L*a*b* renk ölçümü geliştirildi."
          )
          whats_new_en = (
              "What's New in Zamera v0.1.4:\n"
              "• Art Mode 1:1 Radiometric Exposure Fix: Restored true scene-linear brightness in 1:1 Tone and Paper L*94 RAW captures via synchronized radiometric midtone matching while preserving 100% of ΔE00 color accuracy, hue, and dark chiaroscuro tones.\n"
              "• Specular Glint Immunity: Prevented varnish/glass reflections from locking down exposure via diffuse p96 pigment capping and refined the L* ≈ 96 constant-hue highlight shoulder.\n"
              "• iOS Viewfinder Stability: Improved live camera viewfinder feed stability across session startup and lens transitions.\n"
              "• Portrait Studio & Inspector: Refined Stage Light backdrop mask, clipboard-first transparent PNG cutout workflow, and tap-to-measure CIE L*a*b* spot colorimetry."
          )

          if target_version_id:
              loc_r = requests.get(f"{BASE}/appStoreVersions/{target_version_id}/appStoreVersionLocalizations", headers=make_headers())
              if loc_r.status_code == 200:
                  for loc in loc_r.json().get("data", []):
                      locale = loc["attributes"]["locale"]
                      loc_id = loc["id"]
                      text = whats_new_tr if locale.startswith("tr") else whats_new_en
                      pr = requests.patch(
                          f"{BASE}/appStoreVersionLocalizations/{loc_id}",
                          headers=make_headers(),
                          json={"data": {"type": "appStoreVersionLocalizations", "id": loc_id, "attributes": {"whatsNew": text}}},
                      )
                      print(f"📝 Updated localization '{locale}': status {pr.status_code} (note: first release ignores whatsNew if 409, which is normal)")

          build_id = None
          for attempt in range(28):
              br = requests.get(
                  f"{BASE}/builds?filter[app]={app_id}&filter[version]={BUILD_NUM}&sort=-uploadedDate&limit=5",
                  headers=make_headers(),
              )
              if br.status_code == 200 and br.json().get("data"):
                  b = br.json()["data"][0]
                  state = b["attributes"].get("processingState")
                  print(f"📦 Build {BUILD_NUM} found (id: {b['id']}, state: {state})")
                  if state == "VALID":
                      build_id = b["id"]
                      break
                  elif state in ("FAILED", "INVALID"):
                      print(f"⚠️ Build {BUILD_NUM} state is {state}")
                      break
              else:
                  print(f"⏳ Attempt {attempt+1}/28: Build {BUILD_NUM} processing on Apple TestFlight, waiting 25s...")
              time.sleep(25)

          if build_id:
              requests.patch(
                  f"{BASE}/builds/{build_id}",
                  headers=make_headers(),
                  json={"data": {"type": "builds", "id": build_id, "attributes": {"usesNonExemptEncryption": False}}},
              )
              print(f"✅ Export compliance set (usesNonExemptEncryption=False) for Build {BUILD_NUM} ({build_id})")
              try:
                  bloc_r = requests.get(f"{BASE}/builds/{build_id}/betaBuildLocalizations", headers=make_headers())
                  existing_locs = {loc["attributes"]["locale"]: loc["id"] for loc in bloc_r.json().get("data", [])} if bloc_r.status_code == 200 else {}
                  for loc_code, loc_text in [("tr", whats_new_tr), ("en-US", whats_new_en)]:
                      if loc_code in existing_locs:
                          requests.patch(
                              f"{BASE}/betaBuildLocalizations/{existing_locs[loc_code]}",
                              headers=make_headers(),
                              json={"data": {"type": "betaBuildLocalizations", "id": existing_locs[loc_code], "attributes": {"whatsNew": loc_text}}},
                          )
                      else:
                          requests.post(
                              f"{BASE}/betaBuildLocalizations",
                              headers=make_headers(),
                              json={"data": {"type": "betaBuildLocalizations", "attributes": {"locale": loc_code, "whatsNew": loc_text}, "relationships": {"build": {"data": {"type": "builds", "id": build_id}}}}},
                          )
                  print(f"📝 TestFlight betaBuildLocalizations synced for Build {BUILD_NUM}")
              except Exception as e:
                  print("ℹ️ Beta localization note:", e)
              if target_version_id:
                  att = requests.patch(
                      f"{BASE}/appStoreVersions/{target_version_id}/relationships/build",
                      headers=make_headers(),
                      json={"data": {"type": "builds", "id": build_id}},
                  )
                  print(f"🔗 Attached Build {BUILD_NUM} to Version {VERSION_STR}: status {att.status_code}")
                  sub_create = requests.post(
                      f"{BASE}/reviewSubmissions",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "reviewSubmissions",
                              "attributes": {"platform": "IOS"},
                              "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
                          }
                      },
                  )
                  if sub_create.status_code in (200, 201):
                      sub_id = sub_create.json()["data"]["id"]
                      requests.post(
                          f"{BASE}/reviewSubmissionItems",
                          headers=make_headers(),
                          json={
                              "data": {
                                  "type": "reviewSubmissionItems",
                                  "relationships": {
                                      "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": sub_id}},
                                      "appStoreVersion": {"data": {"type": "appStoreVersions", "id": target_version_id}},
                                  },
                              }
                          },
                      )
                      confirm = requests.patch(
                          f"{BASE}/reviewSubmissions/{sub_id}",
                          headers=make_headers(),
                          json={"data": {"type": "reviewSubmissions", "id": sub_id, "attributes": {"submitted": True}}},
                      )
                      print("🚀 Review submission attempt status:", confirm.status_code, confirm.text[:300])
                  else:
                      print("ℹ️ Review submission info:", sub_create.status_code, sub_create.text[:300])
          else:
              print(f"ℹ️ Build {BUILD_NUM} is uploaded and continuing Apple TestFlight background processing.")
          EOF
