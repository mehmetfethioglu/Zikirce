name: Zamera iOS Cloud Build, TestFlight & App Store Connect

on:
  push:
    branches: [ zamera-release ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (Xcode 27 / iOS 27 SDK + Rust Staticlib + TestFlight)
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 1.5. Configure Xcode 27 & Verify iOS 27+ SDK
        run: |
          XCODE27_APP=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE27_APP" ]; then
            sudo xcode-select -s "$XCODE27_APP/Contents/Developer"
          fi
          xcodebuild -version
          IOS_SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Detected iOS SDK version: $IOS_SDK_VERSION"
          IOS_SDK_MAJOR="${IOS_SDK_VERSION%%.*}"
          if [ -z "$IOS_SDK_MAJOR" ] || [ "$IOS_SDK_MAJOR" -lt 27 ]; then
            echo "ERROR: iOS SDK 27+ (Xcode 27+) is required to satisfy ITMS-90725; found $IOS_SDK_VERSION" >&2
            exit 1
          fi

      - name: 2. Install Rust iOS target (aarch64-apple-ios)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 3. Build, Test & Stage zamera_core Staticlib for iOS
        working-directory: rust/zamera_core
        run: |
          cargo test --release
          cargo build --release --target aarch64-apple-ios
          mkdir -p ../../packages/zamera_capture/ios/zamera_capture/Frameworks
          cp target/aarch64-apple-ios/release/libzamera_core.a ../../packages/zamera_capture/ios/zamera_capture/Frameworks/libzamera_core.a
          nm -gU ../../packages/zamera_capture/ios/zamera_capture/Frameworks/libzamera_core.a | grep zamera_core_version_cstr

      - name: 4. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-xcode27-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 5. Prepare Flutter iOS & CocoaPods
        working-directory: app
        run: |
          xcodebuild -version
          flutter config --no-enable-swift-package-manager
          flutter doctor -v
          flutter pub get
          flutter build ios --config-only --no-codesign
          cd ios
          pod install --repo-update

      - name: 6. Deploy to TestFlight via Fastlane
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        working-directory: app/ios
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          bundle install
          bundle exec fastlane beta

      - name: Print gym build log on failure
        if: failure()
        run: |
          find ~/Library/Logs/gym -name "*.log" -exec cat {} + || true

      - name: 7. Upload Signed IPA Artifact
        if: always() && hashFiles('app/build/ios/ipa/Zamera.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: zamera-ios-signed-ipa
          path: app/build/ios/ipa/Zamera.ipa
          retention-days: 14

  sync-appstore-connect:
    name: Sync ASO, TestFlight Beta Testers & App Store Release
    needs: build-ios
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        uses: actions/checkout@v4

      - name: Install PyJWT, Cryptography & Requests
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        run: pip install pyjwt cryptography requests

      - name: Sync ASO Metadata, TestFlight Beta Testers, Release Notes & Build
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        run: python3 scripts/sync_appstore_connect.py
