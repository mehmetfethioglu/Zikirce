name: Tahrir iOS Build & TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_only_run_id:
        description: "Optional Run ID containing tahrir-ios-signed-ipa to upload straight to TestFlight"
        required: false
        default: ""
      sync_aso_only:
        description: "Sync Apple App Store Connect ASO metadata, TestFlight testers & notes without building"
        required: false
        default: "false"
  push:
    branches: [ tahrir-ios ]
    paths-ignore:
      - 'android/**'
      - 'docs/**'
      - 'scripts/**'

jobs:
  register-bundle-id:
    name: Register Bundle ID & Check App Store Connect App
    if: ${{ github.event_name != 'workflow_dispatch' || (github.event.inputs.upload_only_run_id == '' && github.event.inputs.sync_aso_only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      app_exists: ${{ steps.ensure_bundle.outputs.app_exists }}
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}

    steps:
      - name: Install PyJWT, Cryptography & Requests
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        run: pip install pyjwt cryptography requests

      - name: Ensure Bundle ID (com.akarworks.tahrir) & Check App Record
        id: ensure_bundle
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        run: |
          python3 - << 'EOF'
          import os, sys, time, jwt, requests

          key_id = os.environ["APP_STORE_KEY_ID"].strip()
          issuer_id = os.environ["APP_STORE_ISSUER_ID"].strip()
          private_key = os.environ["APP_STORE_PRIVATE_KEY"].strip()

          now = int(time.time())
          token = jwt.encode(
              {"iss": issuer_id, "iat": now - 30, "exp": now + 900, "aud": "appstoreconnect-v1"},
              private_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          BASE = "https://api.appstoreconnect.apple.com/v1"
          bundle_id = "com.akarworks.tahrir"

          r = requests.get(f"{BASE}/bundleIds?filter[identifier]={bundle_id}", headers=headers, timeout=30)
          print("Bundle ID lookup status:", r.status_code)
          if r.status_code != 200:
              print("Lookup response:", r.text[:400])
              sys.exit(1)

          data = r.json().get("data", [])
          if not data:
              print(f"Registering Bundle ID '{bundle_id}' on Apple Developer Portal...")
              cr = requests.post(
                  f"{BASE}/bundleIds",
                  headers=headers,
                  json={
                      "data": {
                          "type": "bundleIds",
                          "attributes": {
                              "identifier": bundle_id,
                              "name": "Tahrir",
                              "platform": "IOS",
                          },
                      }
                  },
                  timeout=30,
              )
              print("Register response:", cr.status_code, cr.text[:400])
              if cr.status_code not in (200, 201):
                  sys.exit(1)
          else:
              print(f"Bundle ID '{bundle_id}' already registered (id={data[0]['id']}).")

          app_r = requests.get(f"{BASE}/apps?filter[bundleId]={bundle_id}", headers=headers, timeout=30)
          print("App lookup status:", app_r.status_code)
          apps = app_r.json().get("data", []) if app_r.status_code == 200 else []
          app_exists = "true" if apps else "false"
          if apps:
              print(f"APP_EXISTS=true app_id={apps[0]['id']} name={apps[0].get('attributes', {}).get('name')}")
          else:
              print("APP_EXISTS=false (App Store Connect New App record needed once)")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gh_out:
              gh_out.write(f"app_exists={app_exists}\n")
          EOF

  build-ios:
    name: Build iOS (Xcode 27 / iOS 27 SDK - Apple Silicon) & TestFlight
    needs: register-bundle-id
    if: ${{ github.event_name != 'workflow_dispatch' || (github.event.inputs.upload_only_run_id == '' && github.event.inputs.sync_aso_only != 'true') }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-xcode27-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 3. Configure Flutter & Xcode environment
        run: |
          XCODE27_APP=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE27_APP" ]; then
            sudo xcode-select -s "$XCODE27_APP/Contents/Developer"
          fi
          xcodebuild -version
          IOS_SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Detected iOS SDK version: $IOS_SDK_VERSION"
          IOS_SDK_MAJOR="${IOS_SDK_VERSION%%.*}"
          if [ -z "$IOS_SDK_MAJOR" ] || [ "$IOS_SDK_MAJOR" -lt 27 ]; then
            echo "ERROR: iOS SDK 27+ (Xcode 27+) is required to satisfy ITMS-90725; found $IOS_SDK_VERSION" >&2
            exit 1
          fi
          flutter config --no-enable-swift-package-manager
          flutter doctor -v

      - name: 4. Install dependencies and prepare Flutter iOS
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign
          cd ios
          pod install --repo-update
          cd ..

      - name: 5. Build, Sign & Deploy to TestFlight via Fastlane
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
          APP_EXISTS: ${{ needs.register-bundle-id.outputs.app_exists }}
        run: |
          cd ios
          bundle install
          bundle exec fastlane beta

      - name: Print gym build log on failure
        if: failure()
        run: |
          find ~/Library/Logs/gym -name "*.log" -exec cat {} + || true

      - name: 6. Upload Signed IPA Artifact
        if: always() && hashFiles('build/ios/ipa/Tahrir.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tahrir-ios-signed-ipa
          path: build/ios/ipa/Tahrir.ipa
          retention-days: 14

  upload-existing-ipa:
    name: Upload Existing Signed IPA to TestFlight
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_only_run_id != '' }}
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Download Signed IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: tahrir-ios-signed-ipa
          run-id: ${{ github.event.inputs.upload_only_run_id }}
          github-token: ${{ github.token }}
          path: build/ios/ipa

      - name: 3. Upload Signed IPA to TestFlight
        run: |
          ls -lh build/ios/ipa/
          cd ios
          bundle install
          python3 - << 'PY'
          import json, os
          key = {
              "key_id": os.environ["APP_STORE_KEY_ID"].strip(),
              "issuer_id": os.environ["APP_STORE_ISSUER_ID"].strip(),
              "key": os.environ["APP_STORE_PRIVATE_KEY"].strip(),
              "in_house": False,
          }
          with open("asc_api_key.json", "w", encoding="utf-8") as f:
              json.dump(key, f)
          PY
          trap 'rm -f asc_api_key.json' EXIT
          bundle exec fastlane pilot upload \
            --api_key_path asc_api_key.json \
            --ipa ../build/ios/ipa/Tahrir.ipa \
            --app_identifier com.akarworks.tahrir \
            --skip_waiting_for_build_processing true

  sync-ios-aso:
    name: Sync App Store Connect ASO, TestFlight Testers & Notes
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_aso_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Install PyJWT, Cryptography & Requests
        run: pip install pyjwt cryptography requests

      - name: 3. Sync Bilingual ASO Metadata, Categories, TestFlight Testers & Notes
        run: |
          python3 - << 'EOF'
          import os, re, sys, time, pathlib, jwt, requests

          key_id = os.environ["APP_STORE_KEY_ID"].strip()
          issuer_id = os.environ["APP_STORE_ISSUER_ID"].strip()
          private_key = os.environ["APP_STORE_PRIVATE_KEY"].strip()

          def make_headers():
              now = int(time.time())
              token = jwt.encode(
                  {"iss": issuer_id, "iat": now - 30, "exp": now + 900, "aud": "appstoreconnect-v1"},
                  private_key,
                  algorithm="ES256",
                  headers={"kid": key_id, "typ": "JWT"},
              )
              return {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          BASE = "https://api.appstoreconnect.apple.com/v1"
          BUNDLE_ID = "com.akarworks.tahrir"
          PRIVACY_URL = "https://akarworks.com/tahrir/index.html"
          SUPPORT_URL = "https://akarworks.com/tahrir/support.html"
          MARKETING_URL = "https://akarworks.com/tahrir/indir.html"
          CONTACT_EMAIL = "akarbilisimteknolojileri@gmail.com"

          pubspec_txt = pathlib.Path("pubspec.yaml").read_text(encoding="utf-8")
          m_ver = re.search(r"^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)", pubspec_txt, re.MULTILINE)
          if not m_ver:
              print("ERROR: version X.Y.Z+BUILD not found in pubspec.yaml")
              sys.exit(1)
          TARGET_VERSION = m_ver.group(1)
          TARGET_BUILD = m_ver.group(2)
          print(f"Detected Tahrir version: {TARGET_VERSION} (Build {TARGET_BUILD})")

          beta_tr = (
              f"Tahrir v{TARGET_VERSION} (Build {TARGET_BUILD}) TestFlight Sürümü:\n"
              "• Kıraat & Akıcı Fasıl Okuma Koçu: Açık kitabınızdan 60 sn kavram ısınması ve sayfa içi semantik öbek temposu.\n"
              "• Soluklaşan Destek & Haşiye Köprüsü: Yardımsız akışa geçiş, Orijinal PDF satır cetveli ve aktif hatırlama."
          )
          beta_en = (
              f"Tahrir v{TARGET_VERSION} (Build {TARGET_BUILD}) TestFlight:\n"
              "• Guided Flow Reading Coach: 60s book-specific lexical warmup and in-page 2–4 word semantic chunk pacing.\n"
              "• Scaffolding Fade & Marginalia Bridge: Gradual fade, Original PDF pacer, and end-of-session recall notes."
          )
          notes_path = pathlib.Path("docs") / f"RELEASE_NOTES_v{TARGET_VERSION}_b{TARGET_BUILD}.md"
          if notes_path.is_file():
              notes_md = notes_path.read_text(encoding="utf-8")
              m_tr = re.search(r"### Türkçe \(tr\)\s*(.*?)(?=\n### |\Z)", notes_md, re.DOTALL)
              m_en = re.search(r"### English \(en-US\)\s*(.*?)(?=\n### |\Z)", notes_md, re.DOTALL)
              if m_tr and m_tr.group(1).strip():
                  beta_tr = m_tr.group(1).strip()
              if m_en and m_en.group(1).strip():
                  beta_en = m_en.group(1).strip()

          meta_root = pathlib.Path("ios/fastlane/metadata")
          locales_cfg = {}
          for folder, aliases in [("tr", ["tr", "tr-TR"]), ("en-US", ["en-US", "en-GB"])]:
              fdir = meta_root / folder
              data = {}
              for fname in ("name.txt", "subtitle.txt", "keywords.txt", "promotional_text.txt", "description.txt"):
                  data[fname.replace(".txt", "")] = (fdir / fname).read_text(encoding="utf-8").strip()
              assert len(data["name"]) <= 30, f"{folder} name > 30"
              assert len(data["subtitle"]) <= 30, f"{folder} subtitle > 30"
              assert len(data["keywords"].encode("utf-8")) <= 100, f"{folder} keywords > 100B"
              assert len(data["promotional_text"]) <= 170, f"{folder} promo > 170"
              assert len(data["description"]) <= 4000, f"{folder} desc > 4000"
              locales_cfg[folder] = {"aliases": aliases, **data}

          # 1. Lookup App ID
          app_r = requests.get(f"{BASE}/apps?filter[bundleId]={BUNDLE_ID}", headers=make_headers(), timeout=30)
          app_r.raise_for_status()
          apps = app_r.json().get("data", [])
          if not apps:
              print(f"ERROR: App {BUNDLE_ID} not yet created in App Store Connect. Create it once via (+) New App first.")
              sys.exit(1)
          app_id = apps[0]["id"]
          print(f"APP_FOUND: id={app_id} name={apps[0]['attributes'].get('name')}")

          # 2. Update editable App Store Version
          ver_r = requests.get(f"{BASE}/apps/{app_id}/appStoreVersions?filter[platform]=IOS", headers=make_headers(), timeout=30)
          ver_r.raise_for_status()
          versions = ver_r.json().get("data", [])
          target_version_id = None
          editable_version = None
          for v in versions:
              v_str = v["attributes"]["versionString"]
              v_state = v["attributes"]["appStoreState"]
              print(f"  Version found: {v_str} state={v_state} id={v['id']}")
              if v_str == TARGET_VERSION:
                  target_version_id = v["id"]
                  break
              if v_state in ("PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED", "INVALID_BINARY"):
                  editable_version = v

          if not target_version_id and editable_version:
              target_version_id = editable_version["id"]

          if target_version_id:
              pv = requests.patch(
                  f"{BASE}/appStoreVersions/{target_version_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersions",
                          "id": target_version_id,
                          "attributes": {"versionString": TARGET_VERSION, "copyright": "2026 Akarworks"},
                      }
                  },
                  timeout=30,
              )
              print(f"PATCH appStoreVersions ({TARGET_VERSION}): {pv.status_code}")

          # 3. Update Categories (BOOKS + EDUCATION) & appInfoLocalizations
          ai_r = requests.get(f"{BASE}/apps/{app_id}/appInfos", headers=make_headers(), timeout=30)
          ai_r.raise_for_status()
          app_infos = ai_r.json().get("data", [])
          editable_states = ("PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED", "WAITING_FOR_REVIEW", "IN_REVIEW")
          chosen_ai = next((x for x in app_infos if x["attributes"].get("appStoreState") in editable_states), app_infos[0])
          app_info_id = chosen_ai["id"]

          cat_p = requests.patch(
              f"{BASE}/appInfos/{app_info_id}",
              headers=make_headers(),
              json={
                  "data": {
                      "type": "appInfos",
                      "id": app_info_id,
                      "relationships": {
                          "primaryCategory": {"data": {"type": "appCategories", "id": "BOOKS"}},
                          "secondaryCategory": {"data": {"type": "appCategories", "id": "EDUCATION"}},
                      },
                  }
              },
              timeout=30,
          )
          print(f"PATCH appInfos categories (BOOKS + EDUCATION): {cat_p.status_code}")

          ail_r = requests.get(f"{BASE}/appInfos/{app_info_id}/appInfoLocalizations", headers=make_headers(), timeout=30)
          ail_r.raise_for_status()
          existing_ail = {x["attributes"]["locale"]: x["id"] for x in ail_r.json().get("data", [])}
          for loc_key, cfg in locales_cfg.items():
              matched = next((a for a in cfg["aliases"] if a in existing_ail), None)
              attrs = {"name": cfg["name"], "subtitle": cfg["subtitle"], "privacyPolicyUrl": PRIVACY_URL}
              if matched:
                  lid = existing_ail[matched]
                  resp = requests.patch(
                      f"{BASE}/appInfoLocalizations/{lid}",
                      headers=make_headers(),
                      json={"data": {"type": "appInfoLocalizations", "id": lid, "attributes": attrs}},
                      timeout=30,
                  )
                  print(f"PATCH appInfoLocalization ({matched}): {resp.status_code}")
              else:
                  resp = requests.post(
                      f"{BASE}/appInfoLocalizations",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "appInfoLocalizations",
                              "attributes": {"locale": loc_key, **attrs},
                              "relationships": {"appInfo": {"data": {"type": "appInfos", "id": app_info_id}}},
                          }
                      },
                      timeout=30,
                  )
                  print(f"POST appInfoLocalization ({loc_key}): {resp.status_code}")

          # 4. Update appStoreVersionLocalizations
          if target_version_id:
              vloc_r = requests.get(f"{BASE}/appStoreVersions/{target_version_id}/appStoreVersionLocalizations", headers=make_headers(), timeout=30)
              vloc_r.raise_for_status()
              existing_vloc = {x["attributes"]["locale"]: x["id"] for x in vloc_r.json().get("data", [])}
              for loc_key, cfg in locales_cfg.items():
                  matched = next((a for a in cfg["aliases"] if a in existing_vloc), None)
                  attrs = {
                      "keywords": cfg["keywords"],
                      "promotionalText": cfg["promotional_text"],
                      "description": cfg["description"],
                      "supportUrl": SUPPORT_URL,
                      "marketingUrl": MARKETING_URL,
                  }
                  if matched:
                      lid = existing_vloc[matched]
                      resp = requests.patch(
                          f"{BASE}/appStoreVersionLocalizations/{lid}",
                          headers=make_headers(),
                          json={"data": {"type": "appStoreVersionLocalizations", "id": lid, "attributes": attrs}},
                          timeout=30,
                      )
                      print(f"PATCH appStoreVersionLocalization ({matched}): {resp.status_code}")
                  else:
                      resp = requests.post(
                          f"{BASE}/appStoreVersionLocalizations",
                          headers=make_headers(),
                          json={
                              "data": {
                                  "type": "appStoreVersionLocalizations",
                                  "attributes": {"locale": loc_key, **attrs},
                                  "relationships": {"appStoreVersion": {"data": {"type": "appStoreVersions", "id": target_version_id}}},
                              }
                          },
                          timeout=30,
                      )
                      print(f"POST appStoreVersionLocalization ({loc_key}): {resp.status_code}")

          # 5. Sync Zikirce TestFlight Testers + TestFlight metadata & build
          tahrir_beta_group_id = None
          zr = requests.get(f"{BASE}/apps?filter[bundleId]=com.akarworks.zikirce", headers=make_headers(), timeout=30)
          zikirce_apps = zr.json().get("data", []) if zr.status_code == 200 else []
          tester_ids = set()
          if zikirce_apps:
              zikirce_id = zikirce_apps[0]["id"]
              next_url = f"{BASE}/betaTesters?filter[apps]={zikirce_id}&limit=200"
              while next_url:
                  tr_resp = requests.get(next_url, headers=make_headers(), timeout=30)
                  if tr_resp.status_code != 200:
                      break
                  tr_json = tr_resp.json()
                  for t in tr_json.get("data", []):
                      tester_ids.add(t["id"])
                  next_url = tr_json.get("links", {}).get("next")
              print(f"Collected {len(tester_ids)} unique Zikirce TestFlight tester(s).")

          z_groups_r = requests.get(f"{BASE}/apps/{app_id}/betaGroups?limit=50", headers=make_headers(), timeout=30)
          if z_groups_r.status_code == 200:
              for grp in z_groups_r.json().get("data", []):
                  if grp["attributes"].get("name") == "Zikirce Testers":
                      tahrir_beta_group_id = grp["id"]
                      break
          if not tahrir_beta_group_id:
              cr_grp = requests.post(
                  f"{BASE}/betaGroups",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "betaGroups",
                          "attributes": {
                              "name": "Zikirce Testers",
                              "isInternalGroup": False,
                              "publicLinkEnabled": True,
                              "feedbackEnabled": True,
                          },
                          "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
                      }
                  },
                  timeout=30,
              )
              if cr_grp.status_code in (200, 201):
                  tahrir_beta_group_id = cr_grp.json()["data"]["id"]
                  print(f"Created TestFlight external group 'Zikirce Testers' ({tahrir_beta_group_id})")

          if tahrir_beta_group_id and tester_ids:
              tid_list = sorted(tester_ids)
              for i in range(0, len(tid_list), 50):
                  chunk = tid_list[i:i + 50]
                  requests.post(
                      f"{BASE}/betaGroups/{tahrir_beta_group_id}/relationships/betaTesters",
                      headers=make_headers(),
                      json={"data": [{"type": "betaTesters", "id": tid} for tid in chunk]},
                      timeout=30,
                  )
              print(f"Synced {len(tid_list)} Zikirce testers into 'Zikirce Testers'.")

          bal_r = requests.get(f"{BASE}/apps/{app_id}/betaAppLocalizations", headers=make_headers(), timeout=30)
          existing_bal = {loc["attributes"]["locale"]: loc["id"] for loc in bal_r.json().get("data", [])} if bal_r.status_code == 200 else {}
          for folder, b_loc in (("tr", "tr"), ("en-US", "en-US")):
              bal_attrs = {
                  "feedbackEmail": CONTACT_EMAIL,
                  "privacyPolicyUrl": PRIVACY_URL,
                  "description": locales_cfg[folder]["description"][:4000],
              }
              if b_loc in existing_bal:
                  requests.patch(
                      f"{BASE}/betaAppLocalizations/{existing_bal[b_loc]}",
                      headers=make_headers(),
                      json={"data": {"type": "betaAppLocalizations", "id": existing_bal[b_loc], "attributes": bal_attrs}},
                      timeout=30,
                  )
              else:
                  requests.post(
                      f"{BASE}/betaAppLocalizations",
                      headers=make_headers(),
                      json={"data": {"type": "betaAppLocalizations", "attributes": {"locale": b_loc, **bal_attrs}, "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}}},
                      timeout=30,
                  )

          bard_r = requests.get(f"{BASE}/apps/{app_id}/betaAppReviewDetail", headers=make_headers(), timeout=30)
          if bard_r.status_code == 200 and bard_r.json().get("data"):
              bard_id = bard_r.json()["data"]["id"]
              requests.patch(
                  f"{BASE}/betaAppReviewDetails/{bard_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "betaAppReviewDetails",
                          "id": bard_id,
                          "attributes": {
                              "contactEmail": CONTACT_EMAIL,
                              "contactFirstName": "Mehmet",
                              "contactLastName": "Fethioglu",
                              "demoAccountRequired": False,
                          },
                      }
                  },
                  timeout=30,
              )

          br = requests.get(f"{BASE}/builds?filter[app]={app_id}&filter[version]={TARGET_BUILD}&sort=-uploadedDate&limit=3", headers=make_headers(), timeout=30)
          br.raise_for_status()
          builds = br.json().get("data", [])
          if builds:
              b = builds[0]
              build_id = b["id"]
              proc_state = b["attributes"].get("processingState")
              print(f"Build {TARGET_BUILD} found: id={build_id} processingState={proc_state}")
              if proc_state == "VALID":
                  requests.patch(
                      f"{BASE}/builds/{build_id}",
                      headers=make_headers(),
                      json={"data": {"type": "builds", "id": build_id, "attributes": {"usesNonExemptEncryption": False}}},
                      timeout=30,
                  )
                  if tahrir_beta_group_id:
                      grp_build_r = requests.post(
                          f"{BASE}/betaGroups/{tahrir_beta_group_id}/relationships/builds",
                          headers=make_headers(),
                          json={"data": [{"type": "builds", "id": build_id}]},
                          timeout=30,
                      )
                      print(f"Assigned Build {TARGET_BUILD} to 'Zikirce Testers': {grp_build_r.status_code}")
                      beta_sub_r = requests.post(
                          f"{BASE}/betaAppReviewSubmissions",
                          headers=make_headers(),
                          json={"data": {"type": "betaAppReviewSubmissions", "relationships": {"build": {"data": {"type": "builds", "id": build_id}}}}},
                          timeout=30,
                      )
                      print(f"TestFlight Beta App Review submission: {beta_sub_r.status_code}")

              bloc_r = requests.get(f"{BASE}/builds/{build_id}/betaBuildLocalizations", headers=make_headers(), timeout=30)
              existing_bloc = {x["attributes"]["locale"]: x["id"] for x in bloc_r.json().get("data", [])} if bloc_r.status_code == 200 else {}
              for loc_code, loc_text in [("tr", beta_tr), ("en-US", beta_en)]:
                  if loc_code in existing_bloc:
                      requests.patch(
                          f"{BASE}/betaBuildLocalizations/{existing_bloc[loc_code]}",
                          headers=make_headers(),
                          json={"data": {"type": "betaBuildLocalizations", "id": existing_bloc[loc_code], "attributes": {"whatsNew": loc_text}}},
                          timeout=30,
                      )
                  else:
                      requests.post(
                          f"{BASE}/betaBuildLocalizations",
                          headers=make_headers(),
                          json={"data": {"type": "betaBuildLocalizations", "attributes": {"locale": loc_code, "whatsNew": loc_text}, "relationships": {"build": {"data": {"type": "builds", "id": build_id}}}}},
                          timeout=30,
                      )
          else:
              print(f"Build {TARGET_BUILD} not yet visible in /v1/builds.")

          print("=== TAHRIR APP STORE CONNECT ASO & TESTFLIGHT SYNC COMPLETE ===")
          EOF
