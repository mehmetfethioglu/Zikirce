name: iOS Cloud Build & TestFlight Ready

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    name: Build iOS (macOS Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 4. Check Flutter environment
        run: flutter doctor -v

      - name: 5. Install dependencies
        run: flutter pub get

      - name: 6. Build iOS Release (Free / No Code Signing Required)
        run: |
          flutter build ios --release --no-codesign

      - name: 7. Package Payload for Verification & Testing
        run: |
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios && zip -r Runner-unsigned.ipa Payload

      - name: 8. Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zikirce-ios-unsigned
          path: build/ios/Runner-unsigned.ipa
          retention-days: 14

      # =========================================================================
      # 9. TESTFLIGHT AUTOMATIC DEPLOYMENT
      # =========================================================================
      - name: 9. Deploy to TestFlight via Fastlane
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
        run: |
          cd ios
          bundle install
          bundle exec fastlane beta

