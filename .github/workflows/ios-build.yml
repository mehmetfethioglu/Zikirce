name: iOS Cloud Build & TestFlight Ready

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/playstore-release.yml'
      - 'android/**'
      - 'scripts/play_console_publish.py'
      - 'docs/**'

jobs:
  build-ios:
    name: Build iOS (macOS Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 4. Configure Flutter & Xcode environment
        run: |
          xcodebuild -version
          flutter config --no-enable-swift-package-manager
          flutter doctor -v

      - name: 5. Install dependencies and prepare Flutter iOS
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign
          cd ios
          pod install --repo-update
          cd ..

      # =========================================================================
      # 6. Fastlane: Code Signing, Packaging & TestFlight Deployment
      # =========================================================================
      - name: 6. Deploy to TestFlight via Fastlane
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
        run: |
          cd ios
          bundle install
          bundle exec fastlane beta

      - name: Print gym build log on failure
        if: failure()
        run: |
          find ~/Library/Logs/gym -name "*.log" -exec cat {} + || true

      # =========================================================================
      # 7. Upload Signed IPA Artifact
      # =========================================================================
      - name: 7. Upload TestFlight IPA Artifact
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: zikirce-ios-signed-ipa
          path: build/ios/ipa/Zikirce.ipa
          retention-days: 14

  submit-appstore:
    name: Sync ASO Metadata, Attach Build & Submit to App Store Connect Review
    needs: build-ios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        uses: actions/checkout@v4

      - name: Install PyJWT and Cryptography
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        run: pip install pyjwt cryptography requests

      - name: Sync ASO Metadata, Release Notes, Attach Build & Submit to Review
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        run: |
          python3 - << 'EOF'
          import os, re, sys, time, json, jwt, requests
          from pathlib import Path

          key_id = os.environ["APP_STORE_KEY_ID"].strip()
          issuer_id = os.environ["APP_STORE_ISSUER_ID"].strip()
          private_key = os.environ["APP_STORE_PRIVATE_KEY"].strip()

          def make_headers():
              now = int(time.time())
              payload = {
                  "iss": issuer_id,
                  "iat": now - 30,
                  "exp": now + 1100,
                  "aud": "appstoreconnect-v1",
              }
              token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
              return {
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              }

          repo_root = Path(".")
          pubspec_txt = (repo_root / "pubspec.yaml").read_text(encoding="utf-8")
          m_ver = re.search(r"^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)", pubspec_txt, re.MULTILINE)
          if not m_ver:
              print("ERROR: version X.Y.Z+BUILD not found in pubspec.yaml!")
              sys.exit(1)
          version_name = m_ver.group(1)
          build_number = m_ver.group(2)
          print(f"📌 Detected pubspec version: {version_name} (Build {build_number})")

          # Load TR / EN WhatsNew notes dynamically from docs/RELEASE_NOTES_v{ver}_b{build}.md
          whats_new_tr = (
              f"Zikirce v{version_name} Yenilikleri:\n"
              "• Profesyonel 3B Kıble Bulucu & İftitah Tekbiri Senaryosu: Anıtsal Kâbe külliyesi, sıfır kayma görsel kilidi ve 3 adımlı rehber.\n"
              "• Zikirce TV Modu & Mukabele Ses Senkronizasyonu iyileştirmeleri ve kararlılık düzeltmeleri."
          )
          whats_new_en = (
              f"What's New in Zikirce v{version_name}:\n"
              "• Upgraded 3D Qibla Finder & Opening Takbir Experience: Monumental Kaaba sanctuary, zero-drift alignment lock, and 3-step guide.\n"
              "• Zikirce TV Mukabele audio-sync refinements and stability fixes."
          )
          notes_path = repo_root / "docs" / f"RELEASE_NOTES_v{version_name}_b{build_number}.md"
          if notes_path.exists():
              notes_md = notes_path.read_text(encoding="utf-8")
              m_tr = re.search(r"### Türkçe \(tr\)\s*(.*?)(?=\n### |\Z)", notes_md, re.DOTALL)
              m_en = re.search(r"### English \(en-US\)\s*(.*?)(?=\n### |\Z)", notes_md, re.DOTALL)
              if m_tr and m_tr.group(1).strip():
                  whats_new_tr = m_tr.group(1).strip()
              if m_en and m_en.group(1).strip():
                  whats_new_en = m_en.group(1).strip()

          # Load Fastlane iOS ASO Metadata
          meta_root = repo_root / "ios" / "fastlane" / "metadata"
          ios_meta = {}
          for folder in ("tr", "en-US"):
              fdir = meta_root / folder
              if not fdir.is_dir():
                  continue
              data = {}
              for fname in ("name.txt", "subtitle.txt", "keywords.txt", "promotional_text.txt", "description.txt"):
                  fpath = fdir / fname
                  if fpath.exists():
                      data[fname.replace(".txt", "")] = fpath.read_text(encoding="utf-8").strip()
              if "name" in data and len(data["name"]) > 30:
                  raise ValueError(f"iOS name ({folder}) exceeds 30 chars: {len(data['name'])}")
              if "subtitle" in data and len(data["subtitle"]) > 30:
                  raise ValueError(f"iOS subtitle ({folder}) exceeds 30 chars: {len(data['subtitle'])}")
              if "keywords" in data and len(data["keywords"].encode("utf-8")) > 100:
                  raise ValueError(f"iOS keywords ({folder}) exceed 100 UTF-8 bytes")
              if "promotional_text" in data and len(data["promotional_text"]) > 170:
                  raise ValueError(f"iOS promotional_text ({folder}) exceeds 170 chars")
              if "description" in data and len(data["description"]) > 4000:
                  raise ValueError(f"iOS description ({folder}) exceeds 4000 chars")
              ios_meta[folder] = data

          BASE = "https://api.appstoreconnect.apple.com/v1"

          # 1. Find App ID for com.akarworks.zikirce
          r = requests.get(f"{BASE}/apps?filter[bundleId]=com.akarworks.zikirce", headers=make_headers())
          r.raise_for_status()
          apps = r.json().get("data", [])
          if not apps:
              print("ERROR: App com.akarworks.zikirce not found!")
              sys.exit(1)
          app_id = apps[0]["id"]
          print(f"✅ Found App ID: {app_id}")

          # 2. Find or create App Store Version matching pubspec version_name
          r = requests.get(f"{BASE}/apps/{app_id}/appStoreVersions?filter[platform]=IOS", headers=make_headers())
          r.raise_for_status()
          versions = r.json().get("data", [])
          target_version_id = None
          editable_version = None

          for v in versions:
              v_str = v["attributes"]["versionString"]
              v_state = v["attributes"]["appStoreState"]
              print(f"  Existing version: {v_str} (state: {v_state}, id: {v['id']})")
              if v_str == version_name:
                  target_version_id = v["id"]
                  break
              if v_state in ("PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED", "WAITING_FOR_REVIEW", "INVALID_BINARY"):
                  editable_version = v

          if not target_version_id and editable_version:
              target_version_id = editable_version["id"]
              print(f"🔄 Updating editable version {editable_version['attributes']['versionString']} -> {version_name} ({target_version_id})")
              up = requests.patch(
                  f"{BASE}/appStoreVersions/{target_version_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersions",
                          "id": target_version_id,
                          "attributes": {"versionString": version_name},
                      }
                  },
              )
              print("  Update versionString status:", up.status_code, up.text[:300])

          if not target_version_id:
              print(f"➕ Creating new App Store Version {version_name}...")
              cr = requests.post(
                  f"{BASE}/appStoreVersions",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersions",
                          "attributes": {
                              "platform": "IOS",
                              "versionString": version_name,
                              "releaseType": "AFTER_APPROVAL",
                          },
                          "relationships": {
                              "app": {"data": {"type": "apps", "id": app_id}}
                          },
                      }
                  },
              )
              print("  Create version status:", cr.status_code)
              if cr.status_code in (200, 201):
                  target_version_id = cr.json()["data"]["id"]
              else:
                  print("  Create version response:", cr.text)
                  sys.exit(1)

          print(f"✅ Target App Store Version ID for {version_name}: {target_version_id}")

          # 2B. Sync App-level Name & Subtitle via editable appInfoLocalizations
          if ios_meta:
              ai_res = requests.get(f"{BASE}/apps/{app_id}/appInfos", headers=make_headers())
              if ai_res.status_code == 200:
                  app_infos = ai_res.json().get("data", [])
                  editable_states = {"PREPARE_FOR_SUBMISSION", "WAITING_FOR_REVIEW", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED"}
                  chosen_info = next(
                      (a for a in app_infos if a.get("attributes", {}).get("appStoreState") in editable_states),
                      app_infos[0] if app_infos else None,
                  )
                  if chosen_info:
                      ai_id = chosen_info["id"]
                      ail_res = requests.get(f"{BASE}/appInfos/{ai_id}/appInfoLocalizations", headers=make_headers())
                      if ail_res.status_code == 200:
                          for loc in ail_res.json().get("data", []):
                              locale = loc["attributes"]["locale"]
                              folder = "tr" if locale.startswith("tr") else ("en-US" if locale.startswith("en") else None)
                              if not folder or folder not in ios_meta:
                                  continue
                              meta_fields = ios_meta[folder]
                              attrs = {}
                              if meta_fields.get("name"):
                                  attrs["name"] = meta_fields["name"]
                              if meta_fields.get("subtitle"):
                                  attrs["subtitle"] = meta_fields["subtitle"]
                              if not attrs:
                                  continue
                              pr_info = requests.patch(
                                  f"{BASE}/appInfoLocalizations/{loc['id']}",
                                  headers=make_headers(),
                                  json={
                                      "data": {
                                          "type": "appInfoLocalizations",
                                          "id": loc["id"],
                                          "attributes": attrs,
                                      }
                                  },
                              )
                              if pr_info.status_code in (200, 201):
                                  print(f"🏷️ Updated AppInfo name/subtitle for '{locale}': {attrs}")
                              else:
                                  print(f"⚠️ AppInfoLocalization patch skipped for '{locale}' ({pr_info.status_code}): {pr_info.text[:250]}")

          # 3. Sync Version Localizations (whatsNew + keywords + promotionalText + description)
          loc_r = requests.get(f"{BASE}/appStoreVersions/{target_version_id}/appStoreVersionLocalizations", headers=make_headers())
          loc_r.raise_for_status()
          locs = loc_r.json().get("data", [])
          for loc in locs:
              locale = loc["attributes"]["locale"]
              loc_id = loc["id"]
              folder = "tr" if locale.startswith("tr") else ("en-US" if locale.startswith("en") else None)
              attrs = {"whatsNew": whats_new_tr if locale.startswith("tr") else whats_new_en}
              if folder and folder in ios_meta:
                  mf = ios_meta[folder]
                  if mf.get("keywords"):
                      attrs["keywords"] = mf["keywords"]
                  if mf.get("promotional_text"):
                      attrs["promotionalText"] = mf["promotional_text"]
                  if mf.get("description"):
                      attrs["description"] = mf["description"]
              pr = requests.patch(
                  f"{BASE}/appStoreVersionLocalizations/{loc_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersionLocalizations",
                          "id": loc_id,
                          "attributes": attrs,
                      }
                  },
              )
              print(f"📝 Updated version localization '{locale}': status {pr.status_code}")
              if pr.status_code not in (200, 201):
                  print(f"⚠️ Full localization patch failed for '{locale}' ({pr.status_code}): {pr.text[:300]}")
                  pr_fallback = requests.patch(
                      f"{BASE}/appStoreVersionLocalizations/{loc_id}",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "appStoreVersionLocalizations",
                              "id": loc_id,
                              "attributes": {"whatsNew": attrs["whatsNew"]},
                          }
                      },
                  )
                  print(f"📝 Fallback whatsNew patch for '{locale}': status {pr_fallback.status_code}")
                  if pr_fallback.status_code not in (200, 201):
                      print(f"⚠️ Fallback whatsNew patch response for '{locale}': {pr_fallback.text[:300]}")

          # 4. Wait for target Build to finish Apple processing (if needed) and attach
          build_id = None
          for attempt in range(30):
              br = requests.get(
                  f"{BASE}/builds?filter[app]={app_id}&filter[version]={build_number}&sort=-uploadedDate&limit=5",
                  headers=make_headers(),
              )
              br.raise_for_status()
              b_list = br.json().get("data", [])
              if b_list:
                  b = b_list[0]
                  state = b["attributes"].get("processingState")
                  print(f"📦 Build {build_number} found (id: {b['id']}, state: {state})")
                  if state == "VALID":
                      build_id = b["id"]
                      break
                  elif state in ("FAILED", "INVALID"):
                      print(f"❌ Build {build_number} state is invalid/failed!")
                      break
              else:
                  print(f"⏳ Attempt {attempt+1}/30: Build {build_number} still processing on Apple servers, waiting 25s...")
              time.sleep(25)

          if build_id:
              requests.patch(
                  f"{BASE}/builds/{build_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "builds",
                          "id": build_id,
                          "attributes": {"usesNonExemptEncryption": False},
                      }
                  },
              )
              att = requests.patch(
                  f"{BASE}/appStoreVersions/{target_version_id}/relationships/build",
                  headers=make_headers(),
                  json={"data": {"type": "builds", "id": build_id}},
              )
              print(f"🔗 Attached Build {build_number} ({build_id}) to Version {version_name}: status {att.status_code}")

              # 5. Submit for App Store Review via reviewSubmissions API
              sub_create = requests.post(
                  f"{BASE}/reviewSubmissions",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "reviewSubmissions",
                          "attributes": {"platform": "IOS"},
                          "relationships": {
                              "app": {"data": {"type": "apps", "id": app_id}}
                          },
                      }
                  },
              )
              if sub_create.status_code in (200, 201):
                  sub_id = sub_create.json()["data"]["id"]
                  item_res = requests.post(
                      f"{BASE}/reviewSubmissionItems",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "reviewSubmissionItems",
                              "relationships": {
                                  "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": sub_id}},
                                  "appStoreVersion": {"data": {"type": "appStoreVersions", "id": target_version_id}},
                              },
                          }
                      },
                  )
                  print("  Added item to reviewSubmission:", item_res.status_code)
                  confirm = requests.patch(
                      f"{BASE}/reviewSubmissions/{sub_id}",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "reviewSubmissions",
                              "id": sub_id,
                              "attributes": {"submitted": True},
                          }
                      },
                  )
                  print(f"🚀 Submitted Version {version_name} (Build {build_number}) for App Store Review:", confirm.status_code, confirm.text[:300])
              else:
                  print("ℹ️ reviewSubmissions note:", sub_create.status_code, sub_create.text[:400])
          else:
              print(f"⚠️ Build {build_number} is still in Apple TestFlight processing queue; Version {version_name} ASO metadata & Release Notes are saved and ready in App Store Connect!")
          EOF
