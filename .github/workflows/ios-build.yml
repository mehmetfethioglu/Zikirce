name: Kilerce iOS Build & TestFlight

on:
  workflow_dispatch:
    inputs:
      upload_only_run_id:
        description: "Optional Run ID containing kilerce-ios-signed-ipa to upload straight to TestFlight"
        required: false
        default: ""
      sync_aso_only:
        description: "Sync Apple App Store Connect ASO metadata & TestFlight notes without building"
        required: false
        default: "false"
  push:
    branches: [ kilerce-ios ]
    paths-ignore:
      - 'android/**'
      - 'docs/**'
      - 'scripts/**'

jobs:
  register-bundle-id:
    name: Register Bundle ID & Check App Store Connect App
    if: ${{ github.event_name != 'workflow_dispatch' || (github.event.inputs.upload_only_run_id == '' && github.event.inputs.sync_aso_only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}

    steps:
      - name: Install PyJWT, Cryptography & Requests
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        run: pip install pyjwt cryptography requests

      - name: Ensure Bundle ID (com.akarworks.kilerce) & Check App Record
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        run: |
          python3 - << 'EOF'
          import os, sys, time, jwt, requests

          key_id = os.environ["APP_STORE_KEY_ID"].strip()
          issuer_id = os.environ["APP_STORE_ISSUER_ID"].strip()
          private_key = os.environ["APP_STORE_PRIVATE_KEY"].strip()

          now = int(time.time())
          token = jwt.encode(
              {"iss": issuer_id, "iat": now - 30, "exp": now + 900, "aud": "appstoreconnect-v1"},
              private_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          BASE = "https://api.appstoreconnect.apple.com/v1"
          bundle_id = "com.akarworks.kilerce"

          r = requests.get(f"{BASE}/bundleIds?filter[identifier]={bundle_id}", headers=headers)
          print("Bundle ID lookup status:", r.status_code)
          if r.status_code != 200:
              print("Lookup response:", r.text[:400])
              sys.exit(1)

          data = r.json().get("data", [])
          if not data:
              print(f"Registering Bundle ID '{bundle_id}' on Apple Developer Portal...")
              cr = requests.post(
                  f"{BASE}/bundleIds",
                  headers=headers,
                  json={
                      "data": {
                          "type": "bundleIds",
                          "attributes": {
                              "identifier": bundle_id,
                              "name": "Kilerce",
                              "platform": "IOS",
                          },
                      }
                  },
              )
              print("Register response:", cr.status_code, cr.text[:400])
              if cr.status_code not in (200, 201):
                  sys.exit(1)
          else:
              print(f"Bundle ID '{bundle_id}' already registered (id={data[0]['id']}).")

          app_r = requests.get(f"{BASE}/apps?filter[bundleId]={bundle_id}", headers=headers)
          print("App lookup status:", app_r.status_code)
          apps = app_r.json().get("data", []) if app_r.status_code == 200 else []
          if apps:
              print(f"APP_EXISTS=true app_id={apps[0]['id']} name={apps[0].get('attributes', {}).get('name')}")
          else:
              print("APP_EXISTS=false")
          EOF

  build-ios:
    name: Build iOS (Xcode 27 / iOS 27 SDK - Apple Silicon) & Upload TestFlight
    needs: register-bundle-id
    if: ${{ github.event_name != 'workflow_dispatch' || (github.event.inputs.upload_only_run_id == '' && github.event.inputs.sync_aso_only != 'true') }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-xcode27-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 3. Configure Flutter & Xcode environment
        run: |
          XCODE27_APP=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE27_APP" ]; then
            sudo xcode-select -s "$XCODE27_APP/Contents/Developer"
          fi
          xcodebuild -version
          IOS_SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Detected iOS SDK version: $IOS_SDK_VERSION"
          IOS_SDK_MAJOR="${IOS_SDK_VERSION%%.*}"
          if [ -z "$IOS_SDK_MAJOR" ] || [ "$IOS_SDK_MAJOR" -lt 27 ]; then
            echo "ERROR: iOS SDK 27+ (Xcode 27+) is required to satisfy ITMS-90725; found $IOS_SDK_VERSION" >&2
            exit 1
          fi
          flutter config --no-enable-swift-package-manager
          flutter doctor -v

      - name: 4. Install dependencies and prepare Flutter iOS
        env:
          KILERCE_HMAC_SECRET: ${{ secrets.KILERCE_HMAC_SECRET }}
        run: |
          flutter pub get
          CLEAN_HMAC=$(printf '%s' "$KILERCE_HMAC_SECRET" | tr -d '\r\n' | sed -E 's/^[[:space:]]*(KILERCE_)?HMAC_SECRET[[:space:]]*=[[:space:]]*//' | sed -E "s/^[[:space:]\"']+|[[:space:]\"']+$//g")
          if [ -z "$CLEAN_HMAC" ]; then
            echo "ERROR: GitHub Secret KILERCE_HMAC_SECRET is missing! Add it in Repo Settings -> Secrets -> Actions so iOS TestFlight can sign Cloudflare Worker requests." >&2
            exit 1
          fi
          echo "Verified KILERCE_HMAC_SECRET length: ${#CLEAN_HMAC} chars"
          flutter build ios --release --config-only --no-codesign --dart-define="KILERCE_HMAC_SECRET=$CLEAN_HMAC"
          cd ios
          pod install --repo-update
          cd ..

      - name: 5. Deploy to TestFlight via Fastlane
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
        run: |
          cd ios
          bundle install
          bundle exec fastlane beta

      - name: 5b. Verify AppIcon & Info.plist inside Signed IPA
        if: hashFiles('build/ios/ipa/Kilerce.ipa') != ''
        run: |
          TMP_IPA_DIR=$(mktemp -d)
          unzip -q build/ios/ipa/Kilerce.ipa -d "$TMP_IPA_DIR"
          APP_DIR=$(find "$TMP_IPA_DIR/Payload" -maxdepth 1 -name "*.app" | head -n 1)
          echo "Inspecting app bundle: $APP_DIR"
          ls -la "$APP_DIR/Assets.car"
          plutil -p "$APP_DIR/Info.plist" | grep -E "CFBundleIcon|CFBundleShortVersionString|CFBundleVersion" || true
          rm -rf "$TMP_IPA_DIR"

      - name: Print gym build log on failure
        if: failure()
        run: |
          find ~/Library/Logs/gym -name "*.log" -exec cat {} + || true

      - name: 6. Upload Signed IPA Artifact
        if: always() && hashFiles('build/ios/ipa/Kilerce.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: kilerce-ios-signed-ipa
          path: build/ios/ipa/Kilerce.ipa
          retention-days: 14

  upload-existing-ipa:
    name: Upload Existing Signed IPA to TestFlight
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_only_run_id != '' }}
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Download Signed IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: kilerce-ios-signed-ipa
          run-id: ${{ github.event.inputs.upload_only_run_id }}
          github-token: ${{ github.token }}
          path: build/ios/ipa

      - name: 3. Upload Signed IPA to TestFlight
        run: |
          ls -lh build/ios/ipa/
          cd ios
          bundle install
          python3 - << 'PY'
          import json, os
          key = {
              "key_id": os.environ["APP_STORE_KEY_ID"].strip(),
              "issuer_id": os.environ["APP_STORE_ISSUER_ID"].strip(),
              "key": os.environ["APP_STORE_PRIVATE_KEY"].strip(),
              "in_house": False,
          }
          with open("asc_api_key.json", "w", encoding="utf-8") as f:
              json.dump(key, f)
          PY
          trap 'rm -f asc_api_key.json' EXIT
          bundle exec fastlane pilot upload \
            --api_key_path asc_api_key.json \
            --ipa ../build/ios/ipa/Kilerce.ipa \
            --app_identifier com.akarworks.kilerce \
            --skip_waiting_for_build_processing true

  sync-ios-aso:
    name: Sync App Store Connect ASO, Version & Attach Build
    needs: [build-ios]
    if: ${{ always() && (needs.build-ios.result == 'success' || (github.event_name == 'workflow_dispatch' && github.event.inputs.sync_aso_only == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Install PyJWT, Cryptography & Requests
        run: pip install pyjwt cryptography requests

      - name: 3. Sync Bilingual ASO, Release Notes & Attach Build on App Store Connect
        run: |
          python3 - << 'EOF'
          import os, re, sys, time, json, pathlib, jwt, requests

          key_id = os.environ["APP_STORE_KEY_ID"].strip()
          issuer_id = os.environ["APP_STORE_ISSUER_ID"].strip()
          private_key = os.environ["APP_STORE_PRIVATE_KEY"].strip()
          if not key_id or not issuer_id or not private_key:
              print("App Store Connect secrets missing; skipping ASO sync.")
              sys.exit(0)

          def make_headers():
              now = int(time.time())
              token = jwt.encode(
                  {"iss": issuer_id, "iat": now - 30, "exp": now + 900, "aud": "appstoreconnect-v1"},
                  private_key,
                  algorithm="ES256",
                  headers={"kid": key_id, "typ": "JWT"},
              )
              return {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          pubspec_text = pathlib.Path("pubspec.yaml").read_text(encoding="utf-8")
          m_ver = re.search(r"^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)", pubspec_text, re.MULTILINE)
          if not m_ver:
              print("ERROR: Could not parse version from pubspec.yaml")
              sys.exit(1)

          TARGET_VERSION = m_ver.group(1)
          TARGET_BUILD = m_ver.group(2)
          print(f"Resolved pubspec version: {TARGET_VERSION} (Build {TARGET_BUILD})")

          tr_whatsnew_path = pathlib.Path("docs/play_store_whats_new/whatsnew-tr-TR")
          en_whatsnew_path = pathlib.Path("docs/play_store_whats_new/whatsnew-en-US")
          whatsnew_by_loc = {
              "tr": tr_whatsnew_path.read_text(encoding="utf-8").strip() if tr_whatsnew_path.is_file() else f"Kilerce v{TARGET_VERSION} güncellemesi.",
              "en-US": en_whatsnew_path.read_text(encoding="utf-8").strip() if en_whatsnew_path.is_file() else f"Kilerce v{TARGET_VERSION} update.",
          }

          BASE = "https://api.appstoreconnect.apple.com/v1"
          BUNDLE_ID = "com.akarworks.kilerce"

          # Load ASO metadata files
          meta_root = pathlib.Path("ios/fastlane/metadata")
          locales_cfg = {}
          for folder, aliases in [("tr", ["tr", "tr-TR"]), ("en-US", ["en-US", "en-GB"])]:
              fdir = meta_root / folder
              data = {}
              for fname in ("name.txt", "subtitle.txt", "keywords.txt", "promotional_text.txt", "description.txt"):
                  data[fname.replace(".txt", "")] = (fdir / fname).read_text(encoding="utf-8").strip()
              assert len(data["name"]) <= 30, f"{folder} name > 30"
              assert len(data["subtitle"]) <= 30, f"{folder} subtitle > 30"
              assert len(data["keywords"].encode("utf-8")) <= 100, f"{folder} keywords > 100B"
              assert len(data["promotional_text"]) <= 170, f"{folder} promo > 170"
              assert len(data["description"]) <= 4000, f"{folder} desc > 4000"
              locales_cfg[folder] = {"aliases": aliases, **data}

          # 1. Find App ID
          app_r = requests.get(f"{BASE}/apps?filter[bundleId]={BUNDLE_ID}", headers=make_headers())
          app_r.raise_for_status()
          apps = app_r.json().get("data", [])
          if not apps:
              print(f"ERROR: App {BUNDLE_ID} not found in App Store Connect")
              sys.exit(1)
          app_id = apps[0]["id"]
          print(f"APP_FOUND: id={app_id} name={apps[0]['attributes'].get('name')}")

          # 2. Update or create editable App Store Version -> TARGET_VERSION + copyright
          ver_r = requests.get(f"{BASE}/apps/{app_id}/appStoreVersions?filter[platform]=IOS", headers=make_headers())
          ver_r.raise_for_status()
          versions = ver_r.json().get("data", [])
          target_version_id = None
          editable_version = None
          for v in versions:
              v_str = v["attributes"]["versionString"]
              v_state = v["attributes"]["appStoreState"]
              print(f"  Version found: {v_str} state={v_state} id={v['id']}")
              if v_str == TARGET_VERSION:
                  target_version_id = v["id"]
                  break
              if v_state in ("PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED", "INVALID_BINARY"):
                  editable_version = v

          if not target_version_id and editable_version:
              target_version_id = editable_version["id"]

          if target_version_id:
              pv = requests.patch(
                  f"{BASE}/appStoreVersions/{target_version_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersions",
                          "id": target_version_id,
                          "attributes": {"versionString": TARGET_VERSION, "copyright": "2026 Akarworks"},
                      }
                  },
              )
              print(f"PATCH appStoreVersions ({TARGET_VERSION}): {pv.status_code} {pv.text[:250] if pv.status_code >= 400 else ''}")
              if pv.status_code >= 400:
                  sys.exit(1)
          else:
              cv = requests.post(
                  f"{BASE}/appStoreVersions",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersions",
                          "attributes": {"platform": "IOS", "versionString": TARGET_VERSION, "copyright": "2026 Akarworks"},
                          "relationships": {"app": {"data": {"type": "apps", "id": app_id}}},
                      }
                  },
              )
              print(f"POST appStoreVersions ({TARGET_VERSION}): {cv.status_code} {cv.text[:250] if cv.status_code >= 400 else ''}")
              if cv.status_code >= 400:
                  sys.exit(1)
              target_version_id = cv.json()["data"]["id"]

          # 3. Update AppInfo categories (FOOD_AND_DRINK + HEALTH_AND_FITNESS) & appInfoLocalizations (tr + en-US)
          ai_r = requests.get(f"{BASE}/apps/{app_id}/appInfos", headers=make_headers())
          ai_r.raise_for_status()
          app_infos = ai_r.json().get("data", [])
          editable_states = ("PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED", "WAITING_FOR_REVIEW", "IN_REVIEW")
          chosen_ai = next((x for x in app_infos if x["attributes"].get("appStoreState") in editable_states), app_infos[0])
          app_info_id = chosen_ai["id"]
          print(f"AppInfo selected: id={app_info_id} state={chosen_ai['attributes'].get('appStoreState')}")

          cat_p = requests.patch(
              f"{BASE}/appInfos/{app_info_id}",
              headers=make_headers(),
              json={
                  "data": {
                      "type": "appInfos",
                      "id": app_info_id,
                      "relationships": {
                          "primaryCategory": {"data": {"type": "appCategories", "id": "FOOD_AND_DRINK"}},
                          "secondaryCategory": {"data": {"type": "appCategories", "id": "HEALTH_AND_FITNESS"}},
                      },
                  }
              },
          )
          print(f"PATCH appInfos categories: {cat_p.status_code} {cat_p.text[:300] if cat_p.status_code >= 400 else ''}")
          if cat_p.status_code >= 400:
              sys.exit(1)

          ail_r = requests.get(f"{BASE}/appInfos/{app_info_id}/appInfoLocalizations", headers=make_headers())
          ail_r.raise_for_status()
          existing_ail = {x["attributes"]["locale"]: x["id"] for x in ail_r.json().get("data", [])}
          print("Existing appInfoLocalizations:", list(existing_ail.keys()))

          for loc_key, cfg in locales_cfg.items():
              matched = next((a for a in cfg["aliases"] if a in existing_ail), None)
              attrs = {"name": cfg["name"], "subtitle": cfg["subtitle"]}
              if matched:
                  lid = existing_ail[matched]
                  resp = requests.patch(
                      f"{BASE}/appInfoLocalizations/{lid}",
                      headers=make_headers(),
                      json={"data": {"type": "appInfoLocalizations", "id": lid, "attributes": attrs}},
                  )
                  print(f"PATCH appInfoLocalization ({matched}): {resp.status_code} {resp.text[:250] if resp.status_code >= 400 else ''}")
              else:
                  resp = requests.post(
                      f"{BASE}/appInfoLocalizations",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "appInfoLocalizations",
                              "attributes": {"locale": loc_key, **attrs},
                              "relationships": {"appInfo": {"data": {"type": "appInfos", "id": app_info_id}}},
                          }
                      },
                  )
                  print(f"POST appInfoLocalization ({loc_key}): {resp.status_code} {resp.text[:250] if resp.status_code >= 400 else ''}")
              if resp.status_code >= 400:
                  sys.exit(1)

          # 4. Update appStoreVersionLocalizations (tr + en-US) including whatsNew (with 409 initial-release fallback)
          vloc_r = requests.get(f"{BASE}/appStoreVersions/{target_version_id}/appStoreVersionLocalizations", headers=make_headers())
          vloc_r.raise_for_status()
          existing_vloc = {x["attributes"]["locale"]: x["id"] for x in vloc_r.json().get("data", [])}
          print("Existing appStoreVersionLocalizations:", list(existing_vloc.keys()))

          for loc_key, cfg in locales_cfg.items():
              matched = next((a for a in cfg["aliases"] if a in existing_vloc), None)
              base_attrs = {
                  "keywords": cfg["keywords"],
                  "promotionalText": cfg["promotional_text"],
                  "description": cfg["description"],
              }
              attrs_with_whatsnew = {**base_attrs, "whatsNew": whatsnew_by_loc.get(loc_key, "")}
              if matched:
                  lid = existing_vloc[matched]
                  resp = requests.patch(
                      f"{BASE}/appStoreVersionLocalizations/{lid}",
                      headers=make_headers(),
                      json={"data": {"type": "appStoreVersionLocalizations", "id": lid, "attributes": attrs_with_whatsnew}},
                  )
                  if resp.status_code == 409:
                      resp = requests.patch(
                          f"{BASE}/appStoreVersionLocalizations/{lid}",
                          headers=make_headers(),
                          json={"data": {"type": "appStoreVersionLocalizations", "id": lid, "attributes": base_attrs}},
                      )
                  print(f"PATCH appStoreVersionLocalization ({matched}): {resp.status_code} {resp.text[:250] if resp.status_code >= 400 else ''}")
              else:
                  resp = requests.post(
                      f"{BASE}/appStoreVersionLocalizations",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "appStoreVersionLocalizations",
                              "attributes": {"locale": loc_key, **attrs_with_whatsnew},
                              "relationships": {"appStoreVersion": {"data": {"type": "appStoreVersions", "id": target_version_id}}},
                          }
                      },
                  )
                  if resp.status_code == 409:
                      resp = requests.post(
                          f"{BASE}/appStoreVersionLocalizations",
                          headers=make_headers(),
                          json={
                              "data": {
                                  "type": "appStoreVersionLocalizations",
                                  "attributes": {"locale": loc_key, **base_attrs},
                                  "relationships": {"appStoreVersion": {"data": {"type": "appStoreVersions", "id": target_version_id}}},
                              }
                          },
                      )
                  print(f"POST appStoreVersionLocalization ({loc_key}): {resp.status_code} {resp.text[:250] if resp.status_code >= 400 else ''}")
              if resp.status_code >= 400:
                  sys.exit(1)

          # 5. Poll for Build TARGET_BUILD to become VALID, update encryption/TestFlight notes, and attach build to App Store Version
          max_polls = 15 if os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch" else 3
          build_obj = None
          for attempt in range(1, max_polls + 1):
              br = requests.get(f"{BASE}/builds?filter[app]={app_id}&filter[version]={TARGET_BUILD}&sort=-uploadedDate&limit=3", headers=make_headers())
              br.raise_for_status()
              builds = br.json().get("data", [])
              if builds:
                  build_obj = builds[0]
                  proc_state = build_obj["attributes"].get("processingState")
                  print(f"Poll {attempt}/{max_polls}: Build {TARGET_BUILD} id={build_obj['id']} processingState={proc_state}")
                  if proc_state == "VALID":
                      break
                  if proc_state in ("FAILED", "INVALID"):
                      print(f"ERROR: Build {TARGET_BUILD} entered terminal state {proc_state}")
                      break
              else:
                  print(f"Poll {attempt}/{max_polls}: Build {TARGET_BUILD} not yet visible in /v1/builds...")
              if attempt < max_polls:
                  time.sleep(30)

          if build_obj:
              build_id = build_obj["id"]
              proc_state = build_obj["attributes"].get("processingState")
              if proc_state == "VALID":
                  enc = requests.patch(
                      f"{BASE}/builds/{build_id}",
                      headers=make_headers(),
                      json={"data": {"type": "builds", "id": build_id, "attributes": {"usesNonExemptEncryption": False}}},
                  )
                  print(f"PATCH build usesNonExemptEncryption=False: {enc.status_code}")

                  attach = requests.patch(
                      f"{BASE}/appStoreVersions/{target_version_id}/relationships/build",
                      headers=make_headers(),
                      json={"data": {"type": "builds", "id": build_id}},
                  )
                  print(f"PATCH appStoreVersion build attachment ({TARGET_VERSION} <- build {TARGET_BUILD}): {attach.status_code} {attach.text[:250] if attach.status_code >= 400 else ''}")

              bloc_r = requests.get(f"{BASE}/builds/{build_id}/betaBuildLocalizations", headers=make_headers())
              existing_bloc = {x["attributes"]["locale"]: x["id"] for x in bloc_r.json().get("data", [])} if bloc_r.status_code == 200 else {}
              for loc_code in ("tr", "en-US"):
                  loc_text = whatsnew_by_loc[loc_code]
                  if loc_code in existing_bloc:
                      b_res = requests.patch(
                          f"{BASE}/betaBuildLocalizations/{existing_bloc[loc_code]}",
                          headers=make_headers(),
                          json={"data": {"type": "betaBuildLocalizations", "id": existing_bloc[loc_code], "attributes": {"whatsNew": loc_text}}},
                      )
                      print(f"PATCH betaBuildLocalization ({loc_code}): {b_res.status_code}")
                  else:
                      b_res = requests.post(
                          f"{BASE}/betaBuildLocalizations",
                          headers=make_headers(),
                          json={
                              "data": {
                                  "type": "betaBuildLocalizations",
                                  "attributes": {"locale": loc_code, "whatsNew": loc_text},
                                  "relationships": {"build": {"data": {"type": "builds", "id": build_id}}},
                              }
                          },
                      )
                      print(f"POST betaBuildLocalization ({loc_code}): {b_res.status_code} {b_res.text[:200] if b_res.status_code >= 400 else ''}")
          else:
              print(f"Build {TARGET_BUILD} not yet visible in /v1/builds (still queued for processing).")

          print("=== APP STORE CONNECT ASO & BUILD SYNC COMPLETE ===")
          EOF
