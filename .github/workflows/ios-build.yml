name: iOS Cloud Build & TestFlight Ready

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    name: Build iOS (macOS Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 4. Configure Flutter & Xcode environment
        run: |
          xcodebuild -version
          flutter config --no-enable-swift-package-manager
          flutter doctor -v

      - name: 5. Install dependencies and prepare Flutter iOS
        run: |
          flutter pub get
          flutter build ios --config-only --no-codesign
          cd ios
          pod install --repo-update
          cd ..

      # =========================================================================
      # 6. Fastlane: Code Signing, Packaging & TestFlight Deployment
      # =========================================================================
      - name: 6. Deploy to TestFlight via Fastlane
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
        run: |
          cd ios
          bundle install
          bundle exec fastlane beta

      - name: Print gym build log on failure
        if: failure()
        run: |
          find ~/Library/Logs/gym -name "*.log" -exec cat {} + || true

      # =========================================================================
      # 7. Upload Signed IPA Artifact
      # =========================================================================
      - name: 7. Upload TestFlight IPA Artifact
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: zikirce-ios-signed-ipa
          path: build/ios/ipa/Zikirce.ipa
          retention-days: 14


