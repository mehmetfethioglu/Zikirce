name: iOS Cloud Build & TestFlight Ready

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    name: Build iOS (macOS Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 4. Check Flutter environment
        run: flutter doctor -v

      - name: 5. Install dependencies
        run: flutter pub get

      - name: 6. Build iOS Release (Free / No Code Signing Required)
        run: |
          flutter build ios --release --no-codesign

      - name: 7. Package Payload for Verification & Testing
        run: |
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios && zip -r Runner-unsigned.ipa Payload

      - name: 8. Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zikirce-ios-unsigned
          path: build/ios/Runner-unsigned.ipa
          retention-days: 14

      # =========================================================================
      # 9. (FUTURE) TESTFLIGHT AUTOMATIC DEPLOYMENT (When Apple Developer is Ready)
      # =========================================================================
      # Uncomment the steps below after creating Apple Developer account and adding
      # APP_STORE_CONNECT_KEY_ID, ISSUER_ID, and API_KEY to GitHub Secrets:
