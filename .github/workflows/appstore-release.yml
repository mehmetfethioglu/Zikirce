name: App Store Connect — Create v1.9.3, Attach Build 15 & Submit for Review

on:
  workflow_dispatch:
    inputs:
      version_string:
        description: "App Store Version String (e.g. 1.9.3)"
        required: false
        default: "1.9.3"
      build_number:
        description: "TestFlight Build Number (e.g. 15)"
        required: false
        default: "15"

jobs:
  submit-appstore:
    name: Submit v1.9.3 (Build 15) to App Store Connect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
      TARGET_VERSION: ${{ github.event.inputs.version_string || '1.9.3' }}
      TARGET_BUILD: ${{ github.event.inputs.build_number || '15' }}

    steps:
      - name: Install PyJWT and Cryptography
        run: pip install pyjwt cryptography requests

      - name: Ensure Bundle ID, Configure v1.9.3 Release Notes, Attach Build 15 & Submit to Review
        run: |
          python3 - << 'EOF'
          import os, sys, time, json, jwt, requests

          key_id = os.environ["APP_STORE_KEY_ID"].strip()
          issuer_id = os.environ["APP_STORE_ISSUER_ID"].strip()
          private_key = os.environ["APP_STORE_PRIVATE_KEY"].strip()
          target_version = os.environ.get("TARGET_VERSION", "1.9.3").strip()
          target_build = os.environ.get("TARGET_BUILD", "15").strip()
          bundle_id_str = "com.akarworks.cuedeck"

          def make_headers():
              now = int(time.time())
              payload = {
                  "iss": issuer_id,
                  "iat": now - 30,
                  "exp": now + 1100,
                  "aud": "appstoreconnect-v1",
              }
              token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
              return {
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              }

          BASE = "https://api.appstoreconnect.apple.com/v1"

          # 0. Ensure Bundle ID 'com.akarworks.cuedeck' is registered in Apple Developer Portal
          b_res = requests.get(f"{BASE}/bundleIds?filter[identifier]={bundle_id_str}", headers=make_headers())
          if b_res.status_code == 200:
              b_data = b_res.json().get("data", [])
              if not b_data:
                  print(f"➕ Registering Bundle ID '{bundle_id_str}' in Apple Developer Portal...")
                  reg = requests.post(
                      f"{BASE}/bundleIds",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "bundleIds",
                              "attributes": {
                                  "identifier": bundle_id_str,
                                  "name": "CueDeck Smart TV Remote",
                                  "platform": "IOS",
                              },
                          }
                      },
                  )
                  print("  Bundle ID registration status:", reg.status_code, reg.text[:300])
              else:
                  print(f"✅ Bundle ID '{bundle_id_str}' is already registered in Apple Developer Portal (id: {b_data[0]['id']}).")

          # 1. Find App ID for com.akarworks.cuedeck in App Store Connect
          r = requests.get(f"{BASE}/apps?filter[bundleId]={bundle_id_str}", headers=make_headers())
          r.raise_for_status()
          apps = r.json().get("data", [])
          if not apps:
              print("=" * 80)
              print("⚠️ ACTION REQUIRED: 'com.akarworks.cuedeck' App Store Connect kaydı henüz oluşturulmamış!")
              print("Bundle ID ('com.akarworks.cuedeck') Apple Developer Portal'a otomatik olarak kaydedildi.")
              print("Apple güvenlik politikası gereği ilk uygulama kartı App Store Connect web arayüzünden 1 kez açılmalıdır:")
              print("👉 1. https://appstoreconnect.apple.com/apps adresine gidin ve (+) 'New App' butonuna tıklayın.")
              print("👉 2. Aşağıdaki bilgileri seçip 'Create' butonuna basın (30 saniye):")
              print("      • Platforms: iOS")
              print("      • Name: CueDeck")
              print("      • Primary Language: Turkish (Türkçe)")
              print("      • Bundle ID: com.akarworks.cuedeck")
              print("      • SKU: cuedeck-001")
              print("      • User Access: Full Access")
              print("👉 3. Oluşturduktan sonra bu GitHub Action iş akışını tekrar tetikleyin.")
              print("=" * 80)
              sys.exit(1)

          app_id = apps[0]["id"]
          print(f"✅ Found App ID: {app_id}")

          # 2. Find or create App Store Version (default 1.9.1)
          r = requests.get(f"{BASE}/apps/{app_id}/appStoreVersions?filter[platform]=IOS", headers=make_headers())
          r.raise_for_status()
          versions = r.json().get("data", [])
          target_version_id = None
          editable_version = None

          for v in versions:
              v_str = v["attributes"]["versionString"]
              v_state = v["attributes"]["appStoreState"]
              print(f"  Existing version: {v_str} (state: {v_state}, id: {v['id']})")
              if v_str == target_version:
                  target_version_id = v["id"]
                  break
              if v_state in ("PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED", "WAITING_FOR_REVIEW", "INVALID_BINARY"):
                  editable_version = v

          if not target_version_id and editable_version:
              target_version_id = editable_version["id"]
              print(f"🔄 Updating editable version {editable_version['attributes']['versionString']} -> {target_version} ({target_version_id})")
              up = requests.patch(
                  f"{BASE}/appStoreVersions/{target_version_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersions",
                          "id": target_version_id,
                          "attributes": {"versionString": target_version},
                      }
                  },
              )
              print("  Update versionString status:", up.status_code, up.text[:300])

          if not target_version_id:
              print(f"➕ Creating new App Store Version {target_version}...")
              cr = requests.post(
                  f"{BASE}/appStoreVersions",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersions",
                          "attributes": {
                              "platform": "IOS",
                              "versionString": target_version,
                              "releaseType": "AFTER_APPROVAL",
                          },
                          "relationships": {
                              "app": {"data": {"type": "apps", "id": app_id}}
                          },
                      }
                  },
              )
              print("  Create version status:", cr.status_code)
              if cr.status_code in (200, 201):
                  target_version_id = cr.json()["data"]["id"]
              else:
                  print("  Create version response:", cr.text)
                  sys.exit(1)

          print(f"✅ Target App Store Version ID for {target_version}: {target_version_id}")

          # 3. Set What's New (Release Notes) for TR and EN
          whats_new_tr = (
              f"CueDeck v{target_version} (Build {target_build}) Yenilikleri:\n"
              "• Soft Slate & Warm Alabaster Arayüzü: Tam sayfa Ayarlar ve İzleme Planı ekranı gözü dinlendiren yumuşak renk paleti (#141824 / #E6C17A) ve sade kart düzeniyle yenilendi.\n"
              "• Çift Protokol Evrensel TV Bağlantısı: Standart perakende Android TV ve Google TV cihazları için Port 6466 (6 Haneli PIN) Sıfır Kurulum modu ve gelişmiş kullanıcılar için Port 5555 (RSA-2048 ADB Turbo) <120ms tuş ve YouTube Playlist ışınlama modu eklendi.\n"
              "• CueDeck Pro & 24 Saatlik Ödüllü Pro Pass: Tek bir kısa ödüllü video ile 24 saat boyunca reklamsız Pro Pass açın, 10 farklı günde %40 Sadakat İndirimi kazanın veya tek seferlik Ömür Boyu Pro sahibi olun.\n"
              "• Zamanlanmış İzleme Planlayıcı & AES-256-GCM Bulut Yedekleme: Gerçek işletim sistemi alarmları ve donanım şifreli Google Drive senkronizasyonu güçlendirildi."
          )

          whats_new_en = (
              f"What's New in CueDeck v{target_version} (Build {target_build}):\n"
              "• Soft Slate & Warm Alabaster UI: Redesigned the full-page Settings & Watch Planner screen with a soothing color palette (#141824 / #E6C17A) and streamlined cards.\n"
              "• Dual-Protocol Universal TV Connectivity: Added Zero-Config Port 6466 (6-Digit PIN) pairing for retail Android TV & Google TV devices alongside Port 5555 (RSA-2048 ADB Turbo) for <120ms key injection and direct YouTube Playlist beaming.\n"
              "• CueDeck Pro & 24-Hour Rewarded Pro Pass: Unlock 24 hours of ad-free Pro access with a single rewarded video ad, earn a 40% Loyalty Discount in 10 days, or upgrade once to Lifetime Pro.\n"
              "• Scheduled Watch Planner & AES-256-GCM Cloud Backup: Enhanced native OS reminders and hardware-encrypted Google Drive synchronization."
          )

          loc_r = requests.get(f"{BASE}/appStoreVersions/{target_version_id}/appStoreVersionLocalizations", headers=make_headers())
          loc_r.raise_for_status()
          locs = loc_r.json().get("data", [])
          for loc in locs:
              locale = loc["attributes"]["locale"]
              loc_id = loc["id"]
              text = whats_new_tr if locale.startswith("tr") else whats_new_en
              pr = requests.patch(
                  f"{BASE}/appStoreVersionLocalizations/{loc_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersionLocalizations",
                          "id": loc_id,
                          "attributes": {"whatsNew": text},
                      }
                  },
              )
              print(f"📝 Updated whatsNew for locale '{locale}': status {pr.status_code}")

          # 4. Wait for Build (default 13) to finish Apple processing and attach to Version
          build_id = None
          for attempt in range(24):
              br = requests.get(
                  f"{BASE}/builds?filter[app]={app_id}&filter[version]={target_build}&sort=-uploadedDate&limit=5",
                  headers=make_headers(),
              )
              br.raise_for_status()
              b_list = br.json().get("data", [])
              if b_list:
                  b = b_list[0]
                  state = b["attributes"].get("processingState")
                  print(f"📦 Build {target_build} found (id: {b['id']}, state: {state})")
                  if state == "VALID":
                      build_id = b["id"]
                      break
                  elif state in ("FAILED", "INVALID"):
                      print(f"❌ Build {target_build} state is invalid/failed!")
                      break
              else:
                  print(f"⏳ Attempt {attempt+1}/24: Build {target_build} still processing on Apple servers, waiting 25s...")
              time.sleep(25)

          if build_id:
              # Set export compliance usesNonExemptEncryption = false
              requests.patch(
                  f"{BASE}/builds/{build_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "builds",
                          "id": build_id,
                          "attributes": {"usesNonExemptEncryption": False},
                      }
                  },
              )
              att = requests.patch(
                  f"{BASE}/appStoreVersions/{target_version_id}/relationships/build",
                  headers=make_headers(),
                  json={"data": {"type": "builds", "id": build_id}},
              )
              print(f"🔗 Attached Build {target_build} ({build_id}) to Version {target_version}: status {att.status_code}")

              # 5. Submit for App Store Review via reviewSubmissions API
              sub_create = requests.post(
                  f"{BASE}/reviewSubmissions",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "reviewSubmissions",
                          "attributes": {"platform": "IOS"},
                          "relationships": {
                              "app": {"data": {"type": "apps", "id": app_id}}
                          },
                      }
                  },
              )
              if sub_create.status_code in (200, 201):
                  sub_id = sub_create.json()["data"]["id"]
                  item_res = requests.post(
                      f"{BASE}/reviewSubmissionItems",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "reviewSubmissionItems",
                              "relationships": {
                                  "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": sub_id}},
                                  "appStoreVersion": {"data": {"type": "appStoreVersions", "id": target_version_id}},
                              },
                          }
                      },
                  )
                  print("  Added item to reviewSubmission:", item_res.status_code)
                  confirm = requests.patch(
                      f"{BASE}/reviewSubmissions/{sub_id}",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "reviewSubmissions",
                              "id": sub_id,
                              "attributes": {"submitted": True},
                          }
                      },
                  )
                  print(f"🚀 Submitted Version {target_version} (Build {target_build}) for App Store Review:", confirm.status_code, confirm.text[:300])
              else:
                  print("ℹ️ reviewSubmissions note:", sub_create.status_code, sub_create.text[:400])
          else:
              print(f"⚠️ Build {target_build} is still in Apple TestFlight processing queue; Version {target_version} and TR/EN Release Notes are saved and ready in App Store Connect!")
          EOF
