name: App Store Connect — Create v2.1.10, Attach Build 65 & Submit for Review

on:
  workflow_dispatch:

jobs:
  submit-appstore:
    name: Submit v2.1.10 (Build 65) to App Store Connect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}

    steps:
      - name: Install PyJWT and Cryptography
        run: pip install pyjwt cryptography requests

      - name: Configure v2.1.10 Release Notes, Attach Build 65 & Submit to Review
        run: |
          python3 - << 'EOF'
          import os, sys, time, json, jwt, requests

          key_id = os.environ["APP_STORE_KEY_ID"].strip()
          issuer_id = os.environ["APP_STORE_ISSUER_ID"].strip()
          private_key = os.environ["APP_STORE_PRIVATE_KEY"].strip()

          def make_headers():
              now = int(time.time())
              payload = {
                  "iss": issuer_id,
                  "iat": now - 30,
                  "exp": now + 1100,
                  "aud": "appstoreconnect-v1",
              }
              token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
              return {
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              }

          BASE = "https://api.appstoreconnect.apple.com/v1"

          # 1. Find App ID for com.akarworks.zikirce
          r = requests.get(f"{BASE}/apps?filter[bundleId]=com.akarworks.zikirce", headers=make_headers())
          r.raise_for_status()
          apps = r.json().get("data", [])
          if not apps:
              print("ERROR: App com.akarworks.zikirce not found!")
              sys.exit(1)
          app_id = apps[0]["id"]
          print(f"✅ Found App ID: {app_id}")

          # 2. Find or create App Store Version 2.1.10
          r = requests.get(f"{BASE}/apps/{app_id}/appStoreVersions?filter[platform]=IOS", headers=make_headers())
          r.raise_for_status()
          versions = r.json().get("data", [])
          target_version_id = None
          editable_version = None

          for v in versions:
              v_str = v["attributes"]["versionString"]
              v_state = v["attributes"]["appStoreState"]
              print(f"  Existing version: {v_str} (state: {v_state}, id: {v['id']})")
              if v_str == "2.1.10":
                  target_version_id = v["id"]
                  break
              if v_state in ("PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED", "WAITING_FOR_REVIEW", "INVALID_BINARY"):
                  editable_version = v

          if not target_version_id and editable_version:
              target_version_id = editable_version["id"]
              print(f"🔄 Updating editable version {editable_version['attributes']['versionString']} -> 2.1.10 ({target_version_id})")
              up = requests.patch(
                  f"{BASE}/appStoreVersions/{target_version_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersions",
                          "id": target_version_id,
                          "attributes": {"versionString": "2.1.10"},
                      }
                  },
              )
              print("  Update versionString status:", up.status_code, up.text[:300])

          if not target_version_id:
              print("➕ Creating new App Store Version 2.1.10...")
              cr = requests.post(
                  f"{BASE}/appStoreVersions",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersions",
                          "attributes": {
                              "platform": "IOS",
                              "versionString": "2.1.10",
                              "releaseType": "AFTER_APPROVAL",
                          },
                          "relationships": {
                              "app": {"data": {"type": "apps", "id": app_id}}
                          },
                      }
                  },
              )
              print("  Create version status:", cr.status_code)
              if cr.status_code in (200, 201):
                  target_version_id = cr.json()["data"]["id"]
              else:
                  print("  Create version response:", cr.text)
                  sys.exit(1)

          print(f"✅ Target App Store Version ID for 2.1.10: {target_version_id}")

          # 3. Set What's New (Release Notes) for TR and EN
          whats_new_tr = (
              "Zikirce v2.1.10 Yenilikleri:\n"
              "• iOS Paylaşım Kartı & Görsel Paylaşım Düzeltmesi: iPhone ve iPad cihazlarda zikir, seri, namaz ve ibadet karnesi kartlarını paylaşırken oluşan paylaşım penceresi (sharePositionOrigin) hatası kalıcı olarak giderildi.\n"
              "• Matbû Kur’ân-ı Kerîm Hatim Duası: Mushafların sonunda yer alan 5 bölümlük tam metin Hatim ve Bağışlama Duası, varsayılan Matbû Arapça sahife görünümü ve Selçuklu durak gülleriyle eklendi.\n"
              "• 4 Modlu Kur’ân Okuma, 7 Meâl & 5 Klasik Tefsir: Mushaf, Âyet + Meâl, Akıcı Kitap Meâli ve Sayfa İçi Tefsir modları; 7 Türkçe meâl kıyaslaması ve 5 tam metin klasik tefsir kütüphanesi sunuldu.\n"
              "• 23 Eserlik İslami Külliyat & Ok ile Kelime Takibi: Kütüb-i Sitte, Riyâzü’s-Sâlihîn ve Risale-i Nur Külliyatı ile sesli tilâvette Ok ile Takip işaretçisi eklendi."
          )

          whats_new_en = (
              "What's New in Zikirce v2.1.10:\n"
              "• iOS Share Card & Image Sharing Fix: Resolved the share sheet origin (sharePositionOrigin) error when sharing dhikr, streak, prayer, and worship summary cards on iPhone and iPad.\n"
              "• Printed Mushaf Khatm al-Quran Prayer: Complete 5-part traditional Khatm al-Quran Prayer opening by default in the Printed Mushaf Arabic layout with Seljuk rosette stop markers.\n"
              "• 4-Mode Quran Reader, 7 Translations & 5 Classical Tafseers: Mushaf, Verse + Translation, Flowing Book, and In-Page Tafseer modes with 7 comparative translations and 5 full-text classical Tafseer works.\n"
              "• 23-Volume Classical Islamic Library & Arrow Word Tracking: Full-length editions of Kutub al-Sittah, Riyad as-Salihin, and Risale-i Nur, plus the Arrow Pointer word-tracking mode."
          )

          loc_r = requests.get(f"{BASE}/appStoreVersions/{target_version_id}/appStoreVersionLocalizations", headers=make_headers())
          loc_r.raise_for_status()
          locs = loc_r.json().get("data", [])
          for loc in locs:
              locale = loc["attributes"]["locale"]
              loc_id = loc["id"]
              text = whats_new_tr if locale.startswith("tr") else whats_new_en
              pr = requests.patch(
                  f"{BASE}/appStoreVersionLocalizations/{loc_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersionLocalizations",
                          "id": loc_id,
                          "attributes": {"whatsNew": text},
                      }
                  },
              )
              print(f"📝 Updated whatsNew for locale '{locale}': status {pr.status_code}")

          # 4. Wait for Build 65 to finish Apple processing (if needed) and attach to Version 2.1.10
          build_id = None
          for attempt in range(24):
              br = requests.get(
                  f"{BASE}/builds?filter[app]={app_id}&filter[version]=65&sort=-uploadedDate&limit=5",
                  headers=make_headers(),
              )
              br.raise_for_status()
              b_list = br.json().get("data", [])
              if b_list:
                  b = b_list[0]
                  state = b["attributes"].get("processingState")
                  print(f"📦 Build 65 found (id: {b['id']}, state: {state})")
                  if state == "VALID":
                      build_id = b["id"]
                      break
                  elif state in ("FAILED", "INVALID"):
                      print("❌ Build 65 state is invalid/failed!")
                      break
              else:
                  print(f"⏳ Attempt {attempt+1}/24: Build 65 still processing on Apple servers, waiting 25s...")
              time.sleep(25)

          if build_id:
              # Set export compliance usesNonExemptEncryption = false if needed
              requests.patch(
                  f"{BASE}/builds/{build_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "builds",
                          "id": build_id,
                          "attributes": {"usesNonExemptEncryption": False},
                      }
                  },
              )
              att = requests.patch(
                  f"{BASE}/appStoreVersions/{target_version_id}/relationships/build",
                  headers=make_headers(),
                  json={"data": {"type": "builds", "id": build_id}},
              )
              print(f"🔗 Attached Build 65 ({build_id}) to Version 2.1.10: status {att.status_code}")

              # 5. Submit for App Store Review via reviewSubmissions API
              sub_create = requests.post(
                  f"{BASE}/reviewSubmissions",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "reviewSubmissions",
                          "attributes": {"platform": "IOS"},
                          "relationships": {
                              "app": {"data": {"type": "apps", "id": app_id}}
                          },
                      }
                  },
              )
              if sub_create.status_code in (200, 201):
                  sub_id = sub_create.json()["data"]["id"]
                  item_res = requests.post(
                      f"{BASE}/reviewSubmissionItems",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "reviewSubmissionItems",
                              "relationships": {
                                  "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": sub_id}},
                                  "appStoreVersion": {"data": {"type": "appStoreVersions", "id": target_version_id}},
                              },
                          }
                      },
                  )
                  print("  Added item to reviewSubmission:", item_res.status_code)
                  confirm = requests.patch(
                      f"{BASE}/reviewSubmissions/{sub_id}",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "reviewSubmissions",
                              "id": sub_id,
                              "attributes": {"submitted": True},
                          }
                      },
                  )
                  print("🚀 Submitted Version 2.1.10 (Build 65) for App Store Review:", confirm.status_code, confirm.text[:300])
              else:
                  print("ℹ️ reviewSubmissions note:", sub_create.status_code, sub_create.text[:400])
          else:
              print("⚠️ Build 65 is still in Apple TestFlight processing queue; Version 2.1.10 and TR/EN Release Notes are saved and ready in App Store Connect!")
          EOF
