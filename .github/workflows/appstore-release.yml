name: App Store Connect — Create v2.3.0, Attach Build 68 & Submit for Review

on:
  workflow_dispatch:

jobs:
  submit-appstore:
    name: Submit v2.3.0 (Build 68) to App Store Connect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}

    steps:
      - name: Install PyJWT and Cryptography
        run: pip install pyjwt cryptography requests

      - name: Configure v2.3.0 Release Notes, Attach Build 68 & Submit to Review
        run: |
          python3 - << 'EOF'
          import os, sys, time, json, jwt, requests

          key_id = os.environ["APP_STORE_KEY_ID"].strip()
          issuer_id = os.environ["APP_STORE_ISSUER_ID"].strip()
          private_key = os.environ["APP_STORE_PRIVATE_KEY"].strip()

          def make_headers():
              now = int(time.time())
              payload = {
                  "iss": issuer_id,
                  "iat": now - 30,
                  "exp": now + 1100,
                  "aud": "appstoreconnect-v1",
              }
              token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
              return {
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              }

          BASE = "https://api.appstoreconnect.apple.com/v1"

          # 1. Find App ID for com.akarworks.zikirce
          r = requests.get(f"{BASE}/apps?filter[bundleId]=com.akarworks.zikirce", headers=make_headers())
          r.raise_for_status()
          apps = r.json().get("data", [])
          if not apps:
              print("ERROR: App com.akarworks.zikirce not found!")
              sys.exit(1)
          app_id = apps[0]["id"]
          print(f"✅ Found App ID: {app_id}")

          # 2. Find or create App Store Version 2.3.0
          r = requests.get(f"{BASE}/apps/{app_id}/appStoreVersions?filter[platform]=IOS", headers=make_headers())
          r.raise_for_status()
          versions = r.json().get("data", [])
          target_version_id = None
          editable_version = None

          for v in versions:
              v_str = v["attributes"]["versionString"]
              v_state = v["attributes"]["appStoreState"]
              print(f"  Existing version: {v_str} (state: {v_state}, id: {v['id']})")
              if v_str == "2.3.0":
                  target_version_id = v["id"]
                  break
              if v_state in ("PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED", "WAITING_FOR_REVIEW", "INVALID_BINARY"):
                  editable_version = v

          if not target_version_id and editable_version:
              target_version_id = editable_version["id"]
              print(f"🔄 Updating editable version {editable_version['attributes']['versionString']} -> 2.3.0 ({target_version_id})")
              up = requests.patch(
                  f"{BASE}/appStoreVersions/{target_version_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersions",
                          "id": target_version_id,
                          "attributes": {"versionString": "2.3.0"},
                      }
                  },
              )
              print("  Update versionString status:", up.status_code, up.text[:300])

          if not target_version_id:
              print("➕ Creating new App Store Version 2.3.0...")
              cr = requests.post(
                  f"{BASE}/appStoreVersions",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersions",
                          "attributes": {
                              "platform": "IOS",
                              "versionString": "2.3.0",
                              "releaseType": "AFTER_APPROVAL",
                          },
                          "relationships": {
                              "app": {"data": {"type": "apps", "id": app_id}}
                          },
                      }
                  },
              )
              print("  Create version status:", cr.status_code)
              if cr.status_code in (200, 201):
                  target_version_id = cr.json()["data"]["id"]
              else:
                  print("  Create version response:", cr.text)
                  sys.exit(1)

          print(f"✅ Target App Store Version ID for 2.3.0: {target_version_id}")

          # 3. Set What's New (Release Notes) for TR and EN
          whats_new_tr = (
              "Zikirce v2.3.0 Yenilikleri:\n"
              "• İrfan Meydanı & 32 Farz Kütüphanesi: Alt menüye eklenen yeni İrfan sekmesiyle Günün 5 İrfan Sorusu, 228+ sahih kaynaklı sorudan oluşan İlim Halkaları (Kur’ân-ı Kerîm, Siyer-i Nebî, 32 Farz & İlmihal, Esmâ & Dua, Külliyat), yanlış cevapları kalıcı öğrenmeye dönüştüren SM-2 Aralıklı Hafıza Tekrarı, Külliyat okuma tavsiyeleri, doğrudan ilgili zikri çekme bağlantıları ve 5 yeni İrfan rozeti sunuldu.\n"
              "• Zikir Vakur Kart Karuseli & Hızlı Seçim Çekmecesi: Zikirmatik ekranından tek dokunuşla açılan yeni Vakur Kart Karuseli, özel zikir oluşturma, fiziksel tesbih/yüzük sayacı adedi içe aktarma ve Feraciye Duası tashihi tamamlandı.\n"
              "• Mushaf Sahife Düzeni, Mukabele Hatim & Zikirce TV Hub: Geniş ekran çift sayfa Mushaf görünümü, Mukabele Hatim akışı ve Zikirce TV Hub arayüz ve performans iyileştirmeleri yapıldı."
          )

          whats_new_en = (
              "What's New in Zikirce v2.3.0:\n"
              "• Arena of Wisdom & 32 Farz Library: Introducing the new Wisdom tab featuring the Daily 5 Wisdom Quiz, Circles of Knowledge with 228+ authentic questions across Quran, Seerah, 32 Farz & Catechism, Asma & Dua, and Islamic Library, SM-2 Spaced Repetition Review, tailored reading recommendations, one-tap linked dhikr practice, and 5 new Wisdom badges.\n"
              "• Dhikr Vakur Card Carousel & Selection Sheet: Redesigned one-tap Dhikr Selection Sheet with Vakur Cards, custom litany creation, physical prayer bead count import, and Feraciye Prayer text refinements.\n"
              "• Mushaf Page Spread, Mukabele Khatm & Zikirce TV Hub: Enhanced dual-page Mushaf layout, Mukabele Khatm flow, and Zikirce TV Hub performance and visual polish."
          )

          loc_r = requests.get(f"{BASE}/appStoreVersions/{target_version_id}/appStoreVersionLocalizations", headers=make_headers())
          loc_r.raise_for_status()
          locs = loc_r.json().get("data", [])
          for loc in locs:
              locale = loc["attributes"]["locale"]
              loc_id = loc["id"]
              text = whats_new_tr if locale.startswith("tr") else whats_new_en
              pr = requests.patch(
                  f"{BASE}/appStoreVersionLocalizations/{loc_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersionLocalizations",
                          "id": loc_id,
                          "attributes": {"whatsNew": text},
                      }
                  },
              )
              print(f"📝 Updated whatsNew for locale '{locale}': status {pr.status_code}")

          # 4. Wait for Build 68 to finish Apple processing (if needed) and attach to Version 2.3.0
          build_id = None
          for attempt in range(30):
              br = requests.get(
                  f"{BASE}/builds?filter[app]={app_id}&filter[version]=68&sort=-uploadedDate&limit=5",
                  headers=make_headers(),
              )
              br.raise_for_status()
              b_list = br.json().get("data", [])
              if b_list:
                  b = b_list[0]
                  state = b["attributes"].get("processingState")
                  print(f"📦 Build 68 found (id: {b['id']}, state: {state})")
                  if state == "VALID":
                      build_id = b["id"]
                      break
                  elif state in ("FAILED", "INVALID"):
                      print("❌ Build 68 state is invalid/failed!")
                      break
              else:
                  print(f"⏳ Attempt {attempt+1}/30: Build 68 still processing on Apple servers, waiting 25s...")
              time.sleep(25)

          if build_id:
              # Set export compliance usesNonExemptEncryption = false if needed
              requests.patch(
                  f"{BASE}/builds/{build_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "builds",
                          "id": build_id,
                          "attributes": {"usesNonExemptEncryption": False},
                      }
                  },
              )
              att = requests.patch(
                  f"{BASE}/appStoreVersions/{target_version_id}/relationships/build",
                  headers=make_headers(),
                  json={"data": {"type": "builds", "id": build_id}},
              )
              print(f"🔗 Attached Build 68 ({build_id}) to Version 2.3.0: status {att.status_code}")

              # 5. Submit for App Store Review via reviewSubmissions API
              sub_create = requests.post(
                  f"{BASE}/reviewSubmissions",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "reviewSubmissions",
                          "attributes": {"platform": "IOS"},
                          "relationships": {
                              "app": {"data": {"type": "apps", "id": app_id}}
                          },
                      }
                  },
              )
              if sub_create.status_code in (200, 201):
                  sub_id = sub_create.json()["data"]["id"]
                  item_res = requests.post(
                      f"{BASE}/reviewSubmissionItems",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "reviewSubmissionItems",
                              "relationships": {
                                  "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": sub_id}},
                                  "appStoreVersion": {"data": {"type": "appStoreVersions", "id": target_version_id}},
                              },
                          }
                      },
                  )
                  print("  Added item to reviewSubmission:", item_res.status_code)
                  confirm = requests.patch(
                      f"{BASE}/reviewSubmissions/{sub_id}",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "reviewSubmissions",
                              "id": sub_id,
                              "attributes": {"submitted": True},
                          }
                      },
                  )
                  print("🚀 Submitted Version 2.3.0 (Build 68) for App Store Review:", confirm.status_code, confirm.text[:300])
              else:
                  print("ℹ️ reviewSubmissions note:", sub_create.status_code, sub_create.text[:400])
          else:
              print("⚠️ Build 68 is still in Apple TestFlight processing queue; Version 2.3.0 and TR/EN Release Notes are saved and ready in App Store Connect!")
          EOF
