name: App Store Connect — Create v2.3.0, Attach Build 31 & Submit for Review

on:
  workflow_dispatch:
    inputs:
      version_string:
        description: "App Store Version String (e.g. 2.3.0)"
        required: false
        default: "2.3.0"
      build_number:
        description: "TestFlight Build Number (e.g. 31)"
        required: false
        default: "31"

jobs:
  submit-appstore:
    name: Submit v2.3.0 (Build 31) to App Store Connect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
      TARGET_VERSION: ${{ github.event.inputs.version_string || '2.3.0' }}
      TARGET_BUILD: ${{ github.event.inputs.build_number || '31' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PyJWT, Cryptography, Requests & Pillow
        run: pip install pyjwt cryptography requests pillow

      - name: Sync 8-Locale ASO, Upload Screenshots, Attach Build 31, Configure v2.3.0 & Submit to Review
        run: |
          python3 - << 'EOF'
          import os, sys, time, json, hashlib, jwt, requests
          from PIL import Image

          key_id = os.environ["APP_STORE_KEY_ID"].strip()
          issuer_id = os.environ["APP_STORE_ISSUER_ID"].strip()
          private_key = os.environ["APP_STORE_PRIVATE_KEY"].strip()
          target_version = os.environ.get("TARGET_VERSION", "2.3.0").strip()
          target_build = os.environ.get("TARGET_BUILD", "31").strip()
          bundle_id_str = "com.akarworks.cuedeck"

          PRIVACY_URL = "https://mehmetfethioglu.github.io/cuedeck-indir/"
          SUPPORT_URL = "https://mehmetfethioglu.github.io/cuedeck-indir/support.html"
          MARKETING_URL = "https://mehmetfethioglu.github.io/cuedeck-indir/indir.html"

          def make_headers():
              now = int(time.time())
              payload = {
                  "iss": issuer_id,
                  "iat": now - 30,
                  "exp": now + 1100,
                  "aud": "appstoreconnect-v1",
              }
              token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
              return {
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              }

          BASE = "https://api.appstoreconnect.apple.com/v1"

          # 0. Ensure Bundle ID 'com.akarworks.cuedeck' is registered in Apple Developer Portal
          b_res = requests.get(f"{BASE}/bundleIds?filter[identifier]={bundle_id_str}", headers=make_headers())
          if b_res.status_code == 200:
              b_data = b_res.json().get("data", [])
              if not b_data:
                  print(f"➕ Registering Bundle ID '{bundle_id_str}' in Apple Developer Portal...")
                  reg = requests.post(
                      f"{BASE}/bundleIds",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "bundleIds",
                              "attributes": {
                                  "identifier": bundle_id_str,
                                  "name": "CueDeck Smart TV Remote",
                                  "platform": "IOS",
                              },
                          }
                      },
                  )
                  print("  Bundle ID registration status:", reg.status_code, reg.text[:300])
              else:
                  print(f"✅ Bundle ID '{bundle_id_str}' registered (id: {b_data[0]['id']}).")

          # 1. Find App ID for com.akarworks.cuedeck in App Store Connect
          r = requests.get(f"{BASE}/apps?filter[bundleId]={bundle_id_str}", headers=make_headers())
          r.raise_for_status()
          apps = r.json().get("data", [])
          if not apps:
              print("❌ App com.akarworks.cuedeck not found in App Store Connect!")
              sys.exit(1)

          app_id = apps[0]["id"]
          print(f"✅ Found App ID: {app_id}")

          # 2. Find or create App Store Version (target_version)
          r = requests.get(f"{BASE}/apps/{app_id}/appStoreVersions?filter[platform]=IOS", headers=make_headers())
          r.raise_for_status()
          versions = r.json().get("data", [])
          target_version_id = None
          editable_version = None

          for v in versions:
              v_str = v["attributes"]["versionString"]
              v_state = v["attributes"]["appStoreState"]
              print(f"  Existing version: {v_str} (state: {v_state}, id: {v['id']})")
              if v_str == target_version:
                  target_version_id = v["id"]
                  break
              if v_state in ("PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED", "INVALID_BINARY"):
                  editable_version = v

          if not target_version_id and editable_version:
              target_version_id = editable_version["id"]
              print(f"🔄 Updating editable version {editable_version['attributes']['versionString']} -> {target_version} ({target_version_id})")
              up = requests.patch(
                  f"{BASE}/appStoreVersions/{target_version_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersions",
                          "id": target_version_id,
                          "attributes": {"versionString": target_version},
                      }
                  },
              )
              print("  Update versionString status:", up.status_code, up.text[:300])

          if not target_version_id:
              print(f"➕ Creating new App Store Version {target_version}...")
              cr = requests.post(
                  f"{BASE}/appStoreVersions",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreVersions",
                          "attributes": {
                              "platform": "IOS",
                              "versionString": target_version,
                              "releaseType": "AFTER_APPROVAL",
                          },
                          "relationships": {
                              "app": {"data": {"type": "apps", "id": app_id}}
                          },
                      }
                  },
              )
              print("  Create version status:", cr.status_code)
              if cr.status_code in (200, 201):
                  target_version_id = cr.json()["data"]["id"]
              else:
                  print("  Create version response:", cr.text)
                  sys.exit(1)

          print(f"✅ Target App Store Version ID for {target_version}: {target_version_id}")

          cp_resp = requests.patch(
              f"{BASE}/appStoreVersions/{target_version_id}",
              headers=make_headers(),
              json={
                  "data": {
                      "type": "appStoreVersions",
                      "id": target_version_id,
                      "attributes": {"copyright": "2026 Akarworks"},
                  }
              },
          )
          print("  Set copyright status:", cp_resp.status_code, cp_resp.text[:250] if cp_resp.status_code >= 400 else "")

          rev_detail_attrs = {
              "contactFirstName": "Mehmet",
              "contactLastName": "Fethioglu",
              "contactEmail": "akarbilisimteknolojileri@gmail.com",
              "contactPhone": "+905459592179",
              "demoAccountRequired": False,
              "notes": (
                  "CueDeck is a local Wi-Fi Smart TV remote control and Watch Planner. "
                  "No user account is required to test remote controls, D-Pad/touchpad, "
                  "Wake-on-LAN MAC setup, or local watch schedule planning. Optional Google Drive "
                  "backup uses standard Google OAuth PKCE only if the user opens Cloud Backup."
              ),
          }
          rd_get = requests.get(f"{BASE}/appStoreVersions/{target_version_id}/appStoreReviewDetail", headers=make_headers())
          if rd_get.status_code == 200 and rd_get.json().get("data"):
              rd_id = rd_get.json()["data"]["id"]
              rd_res = requests.patch(
                  f"{BASE}/appStoreReviewDetails/{rd_id}",
                  headers=make_headers(),
                  json={"data": {"type": "appStoreReviewDetails", "id": rd_id, "attributes": rev_detail_attrs}},
              )
              print("  PATCH appStoreReviewDetails:", rd_res.status_code, rd_res.text[:250] if rd_res.status_code >= 400 else "")
          else:
              rd_res = requests.post(
                  f"{BASE}/appStoreReviewDetails",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "appStoreReviewDetails",
                          "attributes": rev_detail_attrs,
                          "relationships": {"appStoreVersion": {"data": {"type": "appStoreVersions", "id": target_version_id}}},
                      }
                  },
              )
              print("  POST appStoreReviewDetails:", rd_res.status_code, rd_res.text[:250] if rd_res.status_code >= 400 else "")

          # 3. Define 8-Locale ASO Metadata (Apple Poka-Yoke verified: Title<=30, Subtitle<=30, Keywords<=100 bytes)
          whats_new_tr = (
              f"CueDeck v{target_version} (Build {target_build}) Yenilikleri:\n"
              "• Tam Arçelik TV Kontrolü: Arçelik/Beko/Grundig Smart TV'ler için şifreli ArWebsocket (port 8080) desteği ile tüm ses, kanal, yön, menü ve klavye kontrolleri aktif.\n"
              "• Otomatik Sesli Arama: Mikrofona söyleyip bitirdiğinizde TV'de arama otomatik başlar; manuel onay gerekmez.\n"
              "• Tek Dokunuşla Yeni Arama: Mikrofona tekrar dokunduğunuzda önceki arama kutusu otomatik silinir ve yeni arama başlatılır."
          )
          whats_new_en = (
              f"What's New in CueDeck v{target_version} (Build {target_build}):\n"
              "• Full Arçelik/Beko/Grundig Control: Added encrypted ArWebsocket (port 8080) support for volume, channels, D-pad, menu, keyboard input, and smart diagnostics.\n"
              "• Hands-Free Auto-Search: Voice commands automatically submit and search on your TV as soon as you finish speaking—no manual Enter required.\n"
              "• Instant Clean Re-Search: Tapping the mic again clears the previous search text in CueDeck and on your TV before starting your new voice search."
          )

          ASO_LOCALES = {
              "tr": {
                  "aliases": ["tr", "tr-TR"],
                  "name": "CueDeck: Evrensel TV Kumanda",
                  "subtitle": "Samsung LG Android IR Touchpad",
                  "keywords": "televizyon,akıllı,tizen,webos,roku,arçelik,vestel,kızılötesi,wol,uyandır,youtube,klavye,mouse",
                  "promo": "IR olmadan iPhone'dan kapalı TV aç (Wake-on-LAN)! Samsung, LG, Philips, VIDAA, Roku ve Android TV tek kumandada.",
                  "whatsNew": whats_new_tr,
                  "desc": (
                      "CueDeck, evinizdeki tüm televizyonları tek bir akıcı kumandada, kapalı TV uyandırma (Wake-on-LAN) motorunda ve akıllı izleme planlayıcısında birleştiren evrensel Smart TV kumandasıdır.\n\n"
                      "KAPALI TV UYANDIRMA (IR GEREKTİRMEZ)\n"
                      "• Evrensel Wake-on-LAN (WoL): Kızılötesi vericisi olmayan iPhone ve iPad cihazlardan bile uyumlu Samsung, LG, Roku, Philips, VIDAA, Sony, Arçelik/Vestel ve Android/Google TV'leri ağ üzerinden açın.\n"
                      "• Otomatik & Manuel MAC Kurulumu: TV MAC adresini SSDP, mDNS, XML/JSON ve ADB ile otomatik algılar veya kumanda/Ayarlar üzerinden manuel girerek tek dokunuşla («TV Uyandır») uyandırmanızı sağlar.\n\n"
                      "DESTEKLENEN TELEVİZYON PROTOKOLLERİ\n"
                      "• Samsung Tizen (8002/8001 WebSocket, Token, IME Klavye, Wake-on-LAN)\n"
                      "• LG webOS (Magic Mouse imleç, tekerlek, yön tuşları, client-key)\n"
                      "• Google TV & Android TV (Port 6466 6 haneli PIN & ADB Port 5555)\n"
                      "• Philips JointSpace v6 (PIN + Digest), Hisense VIDAA (MQTT TLS), Roku ECP, Sony IRCC-IP ve Arçelik/Vestel/UPnP\n\n"
                      "ÖNE ÇIKAN ÖZELLİKLER\n"
                      "• Paylaş → CueDeck (Share-to-TV): YouTube video ve oynatma listelerini DIAL v2 ile TV'de açın veya akşam saatinize planlayın.\n"
                      "• Hassas Touchpad, Canlı Telefon Klavyesi, Türkçe Sesli Komut ve Google Drive Yedekleme.\n"
                      "• Temel kumanda tuşlarında kesinti yok; günlük 3 Share-to-TV ışınlama ve 2 özel izleme planı dahildir."
                  ),
              },
              "en-US": {
                  "aliases": ["en-US", "en-GB"],
                  "name": "CueDeck: Universal TV Remote",
                  "subtitle": "Samsung LG Roku Android & IR",
                  "keywords": "smart,control,tizen,webos,sony,philips,vidaa,wol,wake,power,touchpad,keyboard,youtube,cast",
                  "promo": "Wake turned-off TVs from iPhone via Wake-on-LAN! Control Samsung, LG, Roku, Philips, VIDAA & Android TV.",
                  "whatsNew": whats_new_en,
                  "desc": (
                      "CueDeck is a universal Smart TV remote control, Wake-on-LAN power-on hub, Share-to-TV link launcher, and personal watch planner built for multi-brand living rooms.\n\n"
                      "WAKE TURNED-OFF TVs FROM IPHONE (NO IR NEEDED)\n"
                      "• Universal Wake-on-LAN (WoL): Power on compatible turned-off Smart TVs from iPhone and iPad using subnet Wake-on-LAN magic packets and automatic Power-key fallback.\n"
                      "• Auto & Manual MAC Setup: Automatically extracts TV MAC addresses via SSDP, mDNS, XML/JSON, and ADB—or enter your TV's MAC manually in one tap.\n\n"
                      "UNIVERSAL SMART TV SUPPORT\n"
                      "• Samsung Tizen (8002/8001 WebSocket, token vault, live keyboard, Wake-on-LAN)\n"
                      "• LG webOS (Magic Remote cursor, scroll wheel, D-Pad, persistent client-key)\n"
                      "• Google TV & Android TV (Port 6466 6-digit PIN + ADB Port 5555 Turbo)\n"
                      "• Philips JointSpace v6 (PIN + Digest), Hisense/Toshiba VIDAA (MQTT TLS), Roku ECP, Sony Bravia IRCC-IP, Arcelik/Vestel & UPnP/DLNA\n\n"
                      "KEY FEATURES\n"
                      "• Share to CueDeck: Beam YouTube videos and playlists to your TV immediately via DIAL v2 or schedule for tonight.\n"
                      "• Precision Touchpad, Live Phone Keyboard, Voice Search & AES-256-GCM Backup.\n"
                      "• Core navigation keys always stay responsive without blocking interstitials."
                  ),
              },
              "de-DE": {
                  "aliases": ["de-DE"],
                  "name": "CueDeck: TV Fernbedienung",
                  "subtitle": "Samsung LG Roku Android & IR",
                  "keywords": "fernseher,smart,tizen,webos,philips,sony,vidaa,wol,einschalten,infrarot,touchpad,tastatur,youtube",
                  "promo": "TV per Wake-on-LAN vom iPhone einschalten! Samsung, LG, Philips, VIDAA, Roku & Android TV.",
                  "whatsNew": whats_new_en,
                  "desc": (
                      "CueDeck ist Ihre universelle Smart-TV-Fernbedienung mit Wake-on-LAN-Start ohne Infrarot, YouTube-Direktübertragung und persönlichem Serien-Planer.\n\n"
                      "• TV ohne IR einschalten: Wecken Sie kompatible ausgeschaltete TVs per Wake-on-LAN (automatische & manuelle MAC-Einrichtung).\n"
                      "• Unterstützt Samsung Tizen, LG webOS (Magic Mouse), Google TV / Android TV (6466 PIN & 5555), Philips v6, Hisense VIDAA, Roku, Sony & UPnP.\n"
                      "• Teilen → CueDeck (DIAL v2), Präzisions-Touchpad, Live-Tastatur & OLED Echt-Schwarz-Design."
                  ),
              },
              "es-ES": {
                  "aliases": ["es-ES", "es-MX"],
                  "name": "CueDeck: Control Universal TV",
                  "subtitle": "Samsung LG Roku Android e IR",
                  "keywords": "mando,tele,inteligente,tizen,webos,sony,philips,vidaa,wol,encender,infrarrojo,raton,teclado,youtube",
                  "promo": "Enciende tu TV apagado desde iPhone con Wake-on-LAN. Compatible con Samsung, LG, Roku, Philips y Android TV.",
                  "whatsNew": whats_new_en,
                  "desc": (
                      "CueDeck combina un control remoto universal para Smart TV, encendido Wake-on-LAN sin infrarrojo, envío directo de YouTube y planificador de series.\n\n"
                      "• Enciende tu TV apagado con Wake-on-LAN: Detección automática o registro manual de MAC.\n"
                      "• Compatible con Samsung Tizen, LG webOS (Magic Remote), Google TV / Android TV (PIN 6466 y ADB 5555), Philips v6, Hisense VIDAA, Roku, Sony y UPnP.\n"
                      "• Compartir → CueDeck (DIAL v2), Touchpad táctil, teclado del teléfono y tema Negro OLED."
                  ),
              },
              "fr-FR": {
                  "aliases": ["fr-FR"],
                  "name": "CueDeck: Télécommande Smart TV",
                  "subtitle": "Samsung LG Roku Android & IR",
                  "keywords": "telecommande,tizen,webos,sony,philips,vidaa,wol,allumer,infrarouge,souris,clavier,youtube,cast",
                  "promo": "Allumez votre TV éteinte depuis l'iPhone via Wake-on-LAN ! Samsung, LG, Roku, Philips, VIDAA & Android TV.",
                  "whatsNew": whats_new_en,
                  "desc": (
                      "CueDeck réunit une télécommande universelle Smart TV, l'allumage Wake-on-LAN sans infrarouge, le partage YouTube DIAL v2 et un planificateur de visionnage.\n\n"
                      "• Wake-on-LAN Universel : Détection automatique ou saisie manuelle d'adresse MAC pour allumer votre téléviseur.\n"
                      "• Prise en charge Samsung Tizen, LG webOS (Magic Remote), Google TV / Android TV (PIN 6466 & ADB 5555), Philips v6, VIDAA, Roku, Sony et UPnP."
                  ),
              },
              "ja": {
                  "aliases": ["ja"],
                  "name": "CueDeck: スマートテレビ リモコン",
                  "subtitle": "Samsung LG Sony Android IR操作",
                  "keywords": "テレビ,マウス,キーボード,赤外線,wol,電源,起動,動画,タイマー,共有",
                  "promo": "iPhoneからWake-on-LANで電源オフのテレビを起動！Samsung、LG、Sony、Philips、Android TV対応。",
                  "whatsNew": whats_new_en,
                  "desc": (
                      "CueDeckは、赤外線なしのWake-on-LAN電源オン・YouTube共有・視聴スケジュール管理を統合したスマートTVリモコンです。\n\n"
                      "• 自動＆手動MAC登録によるWake-on-LAN電源オン\n"
                      "• Samsung Tizen、LG webOS（Magic Mouse）、Google TV / Android TV（PIN 6466 & ADB 5555）、Philips v6、VIDAA、Roku、Sony IRCC対応。"
                  ),
              },
              "pt-BR": {
                  "aliases": ["pt-BR"],
                  "name": "CueDeck: Controle Universal TV",
                  "subtitle": "Samsung LG Roku Android e IR",
                  "keywords": "remoto,smart,televisao,tizen,webos,sony,philips,vidaa,wol,ligar,infravermelho,mouse,teclado,youtube",
                  "promo": "Ligue sua TV desligada pelo iPhone via Wake-on-LAN! Compatível com Samsung, LG, Roku, Philips e Android TV.",
                  "whatsNew": whats_new_en,
                  "desc": (
                      "CueDeck é o controle remoto universal para Smart TV com ativação Wake-on-LAN sem infravermelho, envio de YouTube e planejador pessoal.\n\n"
                      "• Wake-on-LAN Universal: Detecção automática e cadastro manual de MAC para ligar TVs compatíveis.\n"
                      "• Compatível com Samsung Tizen, LG webOS (Magic Remote), Google TV / Android TV (PIN 6466 e ADB 5555), Philips v6, VIDAA, Roku, Sony e UPnP."
                  ),
              },
              "ar-SA": {
                  "aliases": ["ar-SA", "ar"],
                  "name": "CueDeck: ريموت التلفاز الذكي",
                  "subtitle": "سامسونج إل جي أندرويد وIR",
                  "keywords": "تلفزيون,tizen,webos,wol,تشغيل,يوتيوب,ماوس,كيبورد,بث,مؤقت,تحكم",
                  "promo": "شغّل التلفاز المغلق من الآيفون عبر Wake-on-LAN! يدعم سامسونج وإل جي وفيليبس وأندرويد TV.",
                  "whatsNew": whats_new_en,
                  "desc": (
                      "CueDeck تطبيق تحكم شامل للتلفاز الذكي مع تشغيل التلفاز المغلق عبر Wake-on-LAN بدون أشعة تحت حمراء وإرسال روابط يوتيوب ومنظم المشاهدة.\n\n"
                      "• تشغيل التلفاز المغلق: اكتشاف تلقائي أو إدخال يدوي لعنوان MAC.\n"
                      "• يدعم سامسونج Tizen وإل جي webOS وGoogle TV وAndroid TV وPhilips v6 وVIDAA وRoku وSony."
                  ),
              },
          }

          for loc_key, cfg in ASO_LOCALES.items():
              assert len(cfg["name"]) <= 30, f"{loc_key} name > 30"
              assert len(cfg["subtitle"]) <= 30, f"{loc_key} subtitle > 30"
              assert len(cfg["keywords"].encode("utf-8")) <= 100, f"{loc_key} keywords > 100 bytes"

          # 3a. Sync 8-locale appInfoLocalizations (Name, Subtitle, Privacy Policy URL)
          ai_r = requests.get(f"{BASE}/apps/{app_id}/appInfos", headers=make_headers())
          ai_r.raise_for_status()
          app_infos = ai_r.json().get("data", [])
          if app_infos:
              editable_states = ("PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED", "WAITING_FOR_REVIEW", "IN_REVIEW")
              chosen_ai = next((x for x in app_infos if x["attributes"].get("appStoreState") in editable_states), app_infos[0])
              app_info_id = chosen_ai["id"]
              print(f"ℹ️ Using appInfo {app_info_id} (state={chosen_ai['attributes'].get('appStoreState')})")

              ail_r = requests.get(f"{BASE}/appInfos/{app_info_id}/appInfoLocalizations", headers=make_headers())
              ail_r.raise_for_status()
              existing_ail = {x["attributes"]["locale"]: x["id"] for x in ail_r.json().get("data", [])}
              print("  Existing appInfoLocalizations:", list(existing_ail.keys()))

              for loc_key, cfg in ASO_LOCALES.items():
                  matched_loc = next((a for a in cfg["aliases"] if a in existing_ail), None)
                  attrs = {
                      "name": cfg["name"],
                      "subtitle": cfg["subtitle"],
                      "privacyPolicyUrl": PRIVACY_URL,
                  }
                  if matched_loc:
                      lid = existing_ail[matched_loc]
                      resp = requests.patch(
                          f"{BASE}/appInfoLocalizations/{lid}",
                          headers=make_headers(),
                          json={"data": {"type": "appInfoLocalizations", "id": lid, "attributes": attrs}},
                      )
                      print(f"  PATCH appInfoLoc {matched_loc}: {resp.status_code}")
                      if resp.status_code >= 400:
                          print("   detail:", resp.text[:250])
                  else:
                      resp = requests.post(
                          f"{BASE}/appInfoLocalizations",
                          headers=make_headers(),
                          json={
                              "data": {
                                  "type": "appInfoLocalizations",
                                  "attributes": {"locale": loc_key, **attrs},
                                  "relationships": {"appInfo": {"data": {"type": "appInfos", "id": app_info_id}}},
                              }
                          },
                      )
                      print(f"  POST appInfoLoc {loc_key}: {resp.status_code}")
                      if resp.status_code >= 400:
                          print("   detail:", resp.text[:250])

          # 3b. Sync 8-locale appStoreVersionLocalizations (Keywords, Description, Promo, Support/Marketing URL, WhatsNew)
          loc_r = requests.get(f"{BASE}/appStoreVersions/{target_version_id}/appStoreVersionLocalizations", headers=make_headers())
          loc_r.raise_for_status()
          existing_vloc = {x["attributes"]["locale"]: x["id"] for x in loc_r.json().get("data", [])}
          print("  Existing appStoreVersionLocalizations:", list(existing_vloc.keys()))

          for loc_key, cfg in ASO_LOCALES.items():
              matched_loc = next((a for a in cfg["aliases"] if a in existing_vloc), None)
              attrs_with_wn = {
                  "description": cfg["desc"],
                  "keywords": cfg["keywords"],
                  "promotionalText": cfg["promo"],
                  "supportUrl": SUPPORT_URL,
                  "marketingUrl": MARKETING_URL,
                  "whatsNew": cfg["whatsNew"],
              }
              attrs_no_wn = {k: v for k, v in attrs_with_wn.items() if k != "whatsNew"}
              if matched_loc:
                  lid = existing_vloc[matched_loc]
                  pr = requests.patch(
                      f"{BASE}/appStoreVersionLocalizations/{lid}",
                      headers=make_headers(),
                      json={"data": {"type": "appStoreVersionLocalizations", "id": lid, "attributes": attrs_with_wn}},
                  )
                  if pr.status_code == 409:
                      pr = requests.patch(
                          f"{BASE}/appStoreVersionLocalizations/{lid}",
                          headers=make_headers(),
                          json={"data": {"type": "appStoreVersionLocalizations", "id": lid, "attributes": attrs_no_wn}},
                      )
                  print(f"  PATCH versionLoc {matched_loc}: {pr.status_code}")
                  if pr.status_code >= 400:
                      print("   detail:", pr.text[:250])
              else:
                  pr = requests.post(
                      f"{BASE}/appStoreVersionLocalizations",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "appStoreVersionLocalizations",
                              "attributes": {"locale": loc_key, **attrs_with_wn},
                              "relationships": {"appStoreVersion": {"data": {"type": "appStoreVersions", "id": target_version_id}}},
                          }
                      },
                  )
                  if pr.status_code == 409:
                      pr = requests.post(
                          f"{BASE}/appStoreVersionLocalizations",
                          headers=make_headers(),
                          json={
                              "data": {
                                  "type": "appStoreVersionLocalizations",
                                  "attributes": {"locale": loc_key, **attrs_no_wn},
                                  "relationships": {"appStoreVersion": {"data": {"type": "appStoreVersions", "id": target_version_id}}},
                              }
                          },
                      )
                  print(f"  POST versionLoc {loc_key}: {pr.status_code}")
                  if pr.status_code >= 400:
                      print("   detail:", pr.text[:250])

          # Upload 5 iPhone 6.5" (1284x2778 RGB PNG) screenshots for tr and en-US if empty
          ss_names = [
              "cuedeck_01_remote_dark.png",
              "cuedeck_02_touchpad_cockpit.png",
              "cuedeck_03_share_to_tv_beam.png",
              "cuedeck_04_watch_planner_tvs.png",
              "cuedeck_05_cuetv_studio.png",
          ]
          prepared_ss = []
          if all(os.path.isfile(os.path.join("marketing", "screenshots", n)) for n in ss_names):
              os.makedirs("/tmp/asc_ss", exist_ok=True)
              for idx, fname in enumerate(ss_names, start=1):
                  im = Image.open(os.path.join("marketing", "screenshots", fname)).convert("RGBA")
                  bg = Image.new("RGBA", im.size, (0, 0, 0, 255))
                  rgb = Image.alpha_composite(bg, im).convert("RGB")
                  bg_px = rgb.getpixel((4, 4))
                  new_h = 2778
                  new_w = int(round(rgb.width * new_h / rgb.height))
                  if new_w > 1284:
                      new_w = 1284
                      new_h = int(round(rgb.height * new_w / rgb.width))
                  resized = rgb.resize((new_w, new_h), Image.Resampling.LANCZOS)
                  canvas = Image.new("RGB", (1284, 2778), bg_px)
                  canvas.paste(resized, ((1284 - new_w) // 2, (2778 - new_h) // 2))
                  out_p = f"/tmp/asc_ss/ios_65_0{idx}.png"
                  canvas.save(out_p, "PNG")
                  with open(out_p, "rb") as sf:
                      raw_bytes = sf.read()
                  prepared_ss.append((f"ios_65_0{idx}.png", raw_bytes, hashlib.md5(raw_bytes).hexdigest()))

          loc_r2 = requests.get(f"{BASE}/appStoreVersions/{target_version_id}/appStoreVersionLocalizations", headers=make_headers())
          if loc_r2.status_code == 200:
              vloc_map = {x["attributes"]["locale"]: x["id"] for x in loc_r2.json().get("data", [])}
              for ss_locale in ("tr", "en-US"):
                  lid = vloc_map.get(ss_locale)
                  if not lid or not prepared_ss:
                      continue
                  ss_sets_r = requests.get(f"{BASE}/appStoreVersionLocalizations/{lid}/appScreenshotSets", headers=make_headers())
                  sets = ss_sets_r.json().get("data", []) if ss_sets_r.status_code == 200 else []
                  set_65 = next((s for s in sets if s["attributes"].get("screenshotDisplayType") == "APP_IPHONE_65"), None)
                  if not set_65:
                      cr_set = requests.post(
                          f"{BASE}/appScreenshotSets",
                          headers=make_headers(),
                          json={
                              "data": {
                                  "type": "appScreenshotSets",
                                  "attributes": {"screenshotDisplayType": "APP_IPHONE_65"},
                                  "relationships": {
                                      "appStoreVersionLocalization": {"data": {"type": "appStoreVersionLocalizations", "id": lid}}
                                  },
                              }
                          },
                      )
                      print(f"  POST appScreenshotSet ({ss_locale}): {cr_set.status_code}")
                      if cr_set.status_code in (200, 201):
                          set_65 = cr_set.json()["data"]
                  if not set_65:
                      continue
                  set_id = set_65["id"]
                  existing_shots = requests.get(f"{BASE}/appScreenshotSets/{set_id}/appScreenshots", headers=make_headers()).json().get("data", [])
                  print(f"📸 Screenshot set ({ss_locale}, {set_id}) existing count: {len(existing_shots)}")
                  if len(existing_shots) == 0:
                      for fname, raw_bytes, md5_hex in prepared_ss:
                          resv = requests.post(
                              f"{BASE}/appScreenshots",
                              headers=make_headers(),
                              json={
                                  "data": {
                                      "type": "appScreenshots",
                                      "attributes": {"fileSize": len(raw_bytes), "fileName": fname},
                                      "relationships": {
                                          "appScreenshotSet": {"data": {"type": "appScreenshotSets", "id": set_id}}
                                      },
                                  }
                              },
                          )
                          if resv.status_code not in (200, 201):
                              print(f"   reserve {fname} err: {resv.status_code} {resv.text[:300]}")
                              continue
                          shot_data = resv.json()["data"]
                          shot_id = shot_data["id"]
                          for op in shot_data["attributes"].get("uploadOperations", []):
                              op_headers = {h["name"]: h["value"] for h in op["requestHeaders"]}
                              chunk = raw_bytes[op["offset"]:op["offset"] + op["length"]]
                              put_r = requests.put(op["url"], headers=op_headers, data=chunk)
                              if put_r.status_code >= 400:
                                  print(f"   PUT chunk err: {put_r.status_code}")
                          commit_shot = requests.patch(
                              f"{BASE}/appScreenshots/{shot_id}",
                              headers=make_headers(),
                              json={
                                  "data": {
                                      "type": "appScreenshots",
                                      "id": shot_id,
                                      "attributes": {"uploaded": True, "sourceFileChecksum": md5_hex},
                                  }
                              },
                          )
                          print(f"  📸 Uploaded {ss_locale}/{fname}: {commit_shot.status_code}")

          # 4. Wait for Build 28 to finish Apple processing and attach to Version 2.1.0 (displays App Icon)
          build_id = None
          for attempt in range(24):
              br = requests.get(
                  f"{BASE}/builds?filter[app]={app_id}&filter[version]={target_build}&sort=-uploadedDate&limit=5",
                  headers=make_headers(),
              )
              br.raise_for_status()
              b_list = br.json().get("data", [])
              if b_list:
                  b = b_list[0]
                  state = b["attributes"].get("processingState")
                  icon_tok = b["attributes"].get("iconAssetToken")
                  print(f"📦 Build {target_build} found (id: {b['id']}, state: {state}, iconAssetToken: {bool(icon_tok)})")
                  if state == "VALID":
                      build_id = b["id"]
                      if icon_tok:
                          print(f"🎨 Build iconAssetToken templateUrl: {icon_tok.get('templateUrl')}")
                      break
                  elif state in ("FAILED", "INVALID"):
                      print(f"❌ Build {target_build} state is invalid/failed!")
                      break
              else:
                  print(f"⏳ Attempt {attempt+1}/24: Build {target_build} still processing on Apple servers, waiting 25s...")
              time.sleep(25)

          if build_id:
              requests.patch(
                  f"{BASE}/builds/{build_id}",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "builds",
                          "id": build_id,
                          "attributes": {"usesNonExemptEncryption": False},
                      }
                  },
              )
              att = requests.patch(
                  f"{BASE}/appStoreVersions/{target_version_id}/relationships/build",
                  headers=make_headers(),
                  json={"data": {"type": "builds", "id": build_id}},
              )
              print(f"🔗 Attached Build {target_build} ({build_id}) to Version {target_version}: status {att.status_code} {att.text[:250]}")

              # 5. Submit for App Store Review via reviewSubmissions API
              old_subs = requests.get(f"{BASE}/apps/{app_id}/reviewSubmissions?filter[platform]=IOS", headers=make_headers())
              if old_subs.status_code == 200:
                  for osb in old_subs.json().get("data", []):
                      if osb["attributes"].get("state") in ("READY_FOR_REVIEW", "UNRESOLVED_ISSUES"):
                          requests.patch(
                              f"{BASE}/reviewSubmissions/{osb['id']}",
                              headers=make_headers(),
                              json={"data": {"type": "reviewSubmissions", "id": osb["id"], "attributes": {"canceled": True}}},
                          )

              sub_create = requests.post(
                  f"{BASE}/reviewSubmissions",
                  headers=make_headers(),
                  json={
                      "data": {
                          "type": "reviewSubmissions",
                          "attributes": {"platform": "IOS"},
                          "relationships": {
                              "app": {"data": {"type": "apps", "id": app_id}}
                          },
                      }
                  },
              )
              if sub_create.status_code in (200, 201):
                  sub_id = sub_create.json()["data"]["id"]
                  item_res = requests.post(
                      f"{BASE}/reviewSubmissionItems",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "reviewSubmissionItems",
                              "relationships": {
                                  "reviewSubmission": {"data": {"type": "reviewSubmissions", "id": sub_id}},
                                  "appStoreVersion": {"data": {"type": "appStoreVersions", "id": target_version_id}},
                              },
                          }
                      },
                  )
                  print("  Added item to reviewSubmission:", item_res.status_code, item_res.text)
                  confirm = requests.patch(
                      f"{BASE}/reviewSubmissions/{sub_id}",
                      headers=make_headers(),
                      json={
                          "data": {
                              "type": "reviewSubmissions",
                              "id": sub_id,
                              "attributes": {"submitted": True},
                          }
                      },
                  )
                  print(f"🚀 Submitted Version {target_version} (Build {target_build}) for App Store Review:", confirm.status_code, confirm.text)
              else:
                  print("ℹ️ reviewSubmissions note:", sub_create.status_code, sub_create.text)
          else:
              print(f"⚠️ Build {target_build} not VALID yet; Version {target_version} and 8-locale ASO metadata saved in App Store Connect!")
          EOF
