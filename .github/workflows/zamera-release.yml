name: Zamera — Android & iOS Cloud Release (Google Play & TestFlight)

on:
  push:
    branches: [ zamera-release ]
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play Track (beta, internal, production)"
        required: false
        default: "beta"
      target_platform:
        description: "Platforms to release (all, android, ios)"
        required: false
        default: "all"
      enable_video_module:
        description: "Enable Pro Video module (ZAMERA_VIDEO)"
        required: false
        default: "true"

jobs:
  build-publish-android:
    name: 🤖 Android: Rust JNI + AAB -> Google Play Closed Testing
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target_platform == 'all' || github.event.inputs.target_platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ZAMERA_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_PROPERTIES: ${{ secrets.ZAMERA_KEY_PROPERTIES || secrets.ANDROID_KEY_PROPERTIES }}
      PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
      PLAY_TRACK: ${{ github.event.inputs.track || 'beta' }}
      ZAMERA_VIDEO: ${{ github.event.inputs.enable_video_module || 'true' }}

    steps:
      - name: 1. Checkout Zamera codebase
        uses: actions/checkout@v4
        with:
          ref: zamera-release

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 2.1 Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 3. Set up Rust & cargo-ndk for 16 KB page alignment
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: 4. Build zamera_core JNI libraries with 16 KB page alignment
        working-directory: rust/zamera_core
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
          CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            export ANDROID_NDK_HOME=$(ls -d $ANDROID_HOME/ndk/* | tail -n 1)
            echo "ANDROID_NDK_HOME set to: $ANDROID_NDK_HOME"
          fi
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../packages/zamera_capture/android/src/main/jniLibs build --release

      - name: 5. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 6. Restore Upload Keystore & key.properties
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_PROPERTIES != '' }}
        working-directory: app
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/zamera-upload-keystore.jks
          printf "%s\n" "$ANDROID_KEY_PROPERTIES" | tr -d '\r' > android/key.properties

      - name: 7. Build Signed Release AAB & APK
        working-directory: app
        run: |
          flutter pub get
          export GRADLE_OPTS="-Dorg.gradle.internal.http.socketTimeout=180000 -Dorg.gradle.internal.http.connectionTimeout=180000"
          for attempt in 1 2 3; do
            echo "📦 Attempt $attempt: Building AAB & APK..."
            if flutter build appbundle --release --dart-define=ZAMERA_VIDEO=${{ env.ZAMERA_VIDEO }} && \
               flutter build apk --release --dart-define=ZAMERA_VIDEO=${{ env.ZAMERA_VIDEO }}; then
              echo "✅ Android build succeeded on attempt $attempt"
              break
            fi
            if [ $attempt -eq 3 ]; then
              echo "❌ Android build failed after 3 attempts"
              exit 1
            fi
            echo "⚠️ Attempt $attempt failed due to network/Gradle timeout, retrying in 10s..."
            sleep 10
          done

      - name: 8. Upload Signed AAB & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zamera-android-release-bundles
          path: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: 9. Publish AAB to Google Play Console Closed Testing
        if: ${{ env.PLAY_STORE_JSON_KEY != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.akarworks.zamera
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ env.PLAY_TRACK }}
          status: completed
          whatsNewDirectory: docs/play_store_whats_new

  build-publish-ios:
    name: 🍎 iOS: Rust Staticlib + Fastlane -> Apple TestFlight
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.target_platform == 'all' || github.event.inputs.target_platform == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      ZAMERA_VIDEO: ${{ github.event.inputs.enable_video_module || 'true' }}

    steps:
      - name: 1. Checkout Zamera codebase
        uses: actions/checkout@v4
        with:
          ref: zamera-release

      - name: 2. Install Rust iOS target (aarch64-apple-ios)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 3. Build & Test zamera_core staticlib for iOS
        working-directory: rust/zamera_core
        run: |
          cargo test --release
          cargo build --release --target aarch64-apple-ios

      - name: 4. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 5. Prepare Flutter iOS & CocoaPods
        working-directory: app
        run: |
          xcodebuild -version
          flutter config --no-enable-swift-package-manager
          flutter doctor -v
          flutter pub get
          flutter build ios --config-only --no-codesign --dart-define=ZAMERA_VIDEO=${{ env.ZAMERA_VIDEO }}
          cd ios
          pod install --repo-update

      - name: 6. Deploy to TestFlight via Fastlane
        if: ${{ env.APP_STORE_KEY_ID != '' && env.APP_STORE_ISSUER_ID != '' && env.APP_STORE_PRIVATE_KEY != '' }}
        working-directory: app/ios
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          bundle install
          bundle exec fastlane beta

      - name: Print gym build log on failure
        if: failure()
        run: |
          find ~/Library/Logs/gym -name "*.log" -exec cat {} + || true

      - name: 7. Upload TestFlight IPA Artifact
        if: always() && hashFiles('app/build/ios/ipa/Zamera.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: zamera-ios-signed-ipa
          path: app/build/ios/ipa/Zamera.ipa
          retention-days: 14
