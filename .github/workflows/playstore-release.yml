name: Android Cloud Build & Google Play Console Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play Track (production, beta, internal)"
        required: false
        default: "production"
      release_status:
        description: "Release Status (completed, draft)"
        required: false
        default: "completed"
  push:
    branches: [ main ]
    paths:
      - 'pubspec.yaml'
      - 'docs/RELEASE_NOTES_*.md'
      - 'android/fastlane/metadata/**'

jobs:
  build-and-publish-android:
    name: Build Signed AAB & Publish to Google Play Console
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
      PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
      PLAY_TRACK: ${{ github.event.inputs.track || 'production' }}
      PLAY_RELEASE_STATUS: ${{ github.event.inputs.release_status || 'completed' }}

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Restore Upload Keystore & key.properties
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_PROPERTIES != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/zikirapp.keystore
          printf "%s\n" "$ANDROID_KEY_PROPERTIES" > android/key.properties

      - name: 5. Build Signed Release AAB
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_PROPERTIES != '' }}
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: 6. Upload Signed AAB Artifact
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_PROPERTIES != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: zikirce-android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: 7. Publish AAB & TR/EN Release Notes to Google Play Console
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_PROPERTIES != '' && env.PLAY_STORE_JSON_KEY != '' }}
        run: |
          pip install pyjwt cryptography requests
          python3 scripts/play_console_publish.py --track "$PLAY_TRACK" --status "$PLAY_RELEASE_STATUS"
