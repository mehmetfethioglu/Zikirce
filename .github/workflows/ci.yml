name: Zamera CI (Rust Core + License Audit + Flutter Analyze & Android Debug)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  rust-core-and-license-audit:
    name: Rust Core Tests & Zero-GPL License Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 3. Run cargo-deny license audit (MIT/Apache-2.0/BSD only)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
          manifest-path: rust/zamera_core/Cargo.toml
          config: rust/zamera_core/deny.toml

      - name: 4. Run zamera_core unit tests & Clippy
        working-directory: rust/zamera_core
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --verbose

  flutter-verify-and-android-build:
    name: Flutter Analyze, Widget Tests & Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Analyze & Test packages and app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: 5. Build Android Debug APK (Probe Ready)
        working-directory: app
        run: |
          flutter build apk --debug

      - name: 6. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zamera-probe-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
