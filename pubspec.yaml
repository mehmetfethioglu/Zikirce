name: zikirce
description: "Zikirce - Modern, yüksek performanslı İslami yaşam ve zikir asistanı."
publish_to: 'none'
version: 2.2.0+66

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 1. State Management & Routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.7

  # 2. Local Database & Storage
  drift: ^2.20.0
  sqlite3: ^2.4.4
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # 3. Audio & Haptics
  just_audio: ^0.9.43
  audio_session: ^0.1.25

  # 4. Notifications & Background Engine
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # 5. UI, Graphics & Animations
  lottie: ^3.1.2
  fl_chart: ^0.68.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  flutter_native_splash: ^2.4.4

  # 6. Networking, Utils & Cloud
  dio: ^5.7.0
  intl: ^0.20.2
  share_plus: ^10.0.2
  sensors_plus: ^6.0.1
  crypto: ^3.0.5
  home_widget: ^0.7.0
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  webview_flutter: ^4.14.1
  file_picker: ^8.1.4
  archive: ^3.6.1
  record: ^7.1.1
  just_audio_windows: ^0.2.3
  url_launcher: ^6.3.2
  desktop_webview_window: ^0.3.0
  sentry_flutter: ^8.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.2
  msix: ^3.18.0

flutter_native_splash:
  color: "#ECF3F0"
  image: assets/images/zikirce_logo.png
  color_dark: "#1A1512"
  image_dark: assets/images/zikirce_logo.png
  android_12:
    image: assets/images/zikirce_logo.png
    color: "#ECF3F0"
    image_dark: assets/images/zikirce_logo.png
    color_dark: "#1A1512"
  ios: true
  android: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/raw/
    - assets/raw/Diyanet_Sayfa_Metinleri_JSON/
    - assets/animations/
    - assets/audio/
    - assets/images/

  fonts:
    - family: AmasyaAbay
      fonts:
        - asset: assets/fonts/AmasyaAbay-Regular.ttf
    - family: mushaf
      fonts:
        - asset: assets/fonts/mushaf.ttf
        - asset: assets/fonts/mushaf_bold.ttf
          weight: 700
    - family: mushaf_bold
      fonts:
        - asset: assets/fonts/mushaf_bold.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 700

msix_config:
  display_name: Zikirce
  publisher_display_name: Zikirce
  identity_name: com.theak.zikirce
  msix_version: 2.0.10.0
  logo_path: assets/images/appicon.png
  capabilities: internetClient
  architecture: arm64
  install_certificate: false
  protocol_activation: com.akarworks.zikirce

