name: hasibu
description: "Hasibu - Yalın Üretim, Çok Şubeli PDKS (Tenfei D35), İK ve Ön Muhasebe Platformu"
publish_to: 'none'
version: 1.0.11+12

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  sqlite3: ^2.4.4
  sqlcipher_flutter_libs: ^0.6.4
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  dio: ^5.7.0
  intl: ^0.20.2
  crypto: ^3.0.5
  qr_flutter: ^4.1.0
  google_sign_in: ^7.2.0

dependency_overrides:
  path_provider_android: 2.2.15
  shared_preferences_android: 2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/hasibu_icon.png
    - assets/icon/hasibu_icon_alt.png
    - assets/icon/hasibu_logo.svg

msix_config:
  display_name: Hasibu
  publisher_display_name: Akarworks
  identity_name: com.akarworks.hasibu
  msix_version: 1.0.11.0
  logo_path: assets/icon/hasibu_icon.png
  architecture: arm64
  capabilities: internetClient
  install_certificate: false
