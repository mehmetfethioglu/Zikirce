name: organicscore
description: "Kilerce: Barkod, Dolap & Tarif - Akıllı Mutfak Envanteri, Gıda Analizi ve Yemek Tavsiye Asistanı."
publish_to: 'none'

version: 3.2.2+16

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.1
  mobile_scanner: ^6.0.4
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_barcode_scanning: ^0.14.0
  connectivity_plus: ^6.1.3
  http: ^1.3.0
  flutter_riverpod: ^2.6.1
  purchases_flutter: ^10.6.0
  google_mobile_ads: ^9.0.0
  share_plus: ^10.1.4
  widgets_to_image: ^1.0.0
  crypto: ^3.0.6
  shared_preferences: ^2.5.2
  image_picker: ^1.1.2
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/icons/
    - assets/images/
    - assets/images/characters/
    - assets/models/
