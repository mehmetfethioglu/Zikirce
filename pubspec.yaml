name: cuedeck
description: "CueDeck: Akıllı Android/Google TV Kumandası, YouTube Playlist Işınlayıcı ve Zamanlanmış İzleme Planlayıcı."
publish_to: 'none'

version: 1.9.3+15

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  crypto: ^3.0.8
  webview_flutter: ^4.14.1
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
